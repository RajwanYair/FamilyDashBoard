  <rect x="540" y="160" width="380" height="320" rx="20" fill="#0f2240"/>
  <circle cx="658" cy="296" r="64" fill="#fbbf24" opacity="0.9"/>
  <circle cx="736" cy="336" r="52" fill="#dbeafe" opacity="0.8"/>
  <circle cx="698" cy="354" r="44" fill="#eff6ff" opacity="0.85"/>
  <rect x="570" y="382" width="200" height="18" rx="9" fill="#dbeafe" opacity="0.6"/>
