  <rect x="988" y="590" width="170" height="10" rx="5" fill="#fbbf24" opacity="0.4"/>
  <rect x="988" y="612" width="140" height="10" rx="5" fill="#60a5fa" opacity="0.45"/>
  <rect x="988" y="634" width="190" height="10" rx="5" fill="#60a5fa" opacity="0.4"/>
