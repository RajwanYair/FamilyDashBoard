  <rect x="148" y="608" width="160" height="10" rx="5" fill="#ef4444" opacity="0.3"/>
  <rect x="148" y="650" width="140" height="10" rx="5" fill="#60a5fa" opacity="0.4"/>
  <rect x="148" y="672" width="160" height="10" rx="5" fill="#60a5fa" opacity="0.4"/>

