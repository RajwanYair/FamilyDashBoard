  <rect x="148" y="232" width="200" height="12" rx="6" fill="#60a5fa" opacity="0.5"/>
  <rect x="148" y="258" width="240" height="12" rx="6" fill="#60a5fa" opacity="0.5"/>
  <rect x="148" y="284" width="170" height="12" rx="6" fill="#60a5fa" opacity="0.4"/>
  <rect x="148" y="310" width="215" height="12" rx="6" fill="#60a5fa" opacity="0.4"/>
  <rect x="148" y="336" width="150" height="12" rx="6" fill="#60a5fa" opacity="0.3"/>
  <rect x="148" y="362" width="190" height="12" rx="6" fill="#60a5fa" opacity="0.3"/>
  <rect x="148" y="388" width="130" height="12" rx="6" fill="#60a5fa" opacity="0.25"/>
