  <rect x="1548" y="560" width="120" height="12" rx="6" fill="url(#accent)" opacity="0.7"/>
  <rect x="1548" y="586" width="200" height="10" rx="5" fill="#34d399" opacity="0.5"/>
  <rect x="1548" y="604" width="160" height="8" rx="4" fill="#34d399" opacity="0.35"/>
  <rect x="1548" y="622" width="200" height="10" rx="5" fill="#60a5fa" opacity="0.5"/>
  <rect x="1548" y="640" width="140" height="8" rx="4" fill="#60a5fa" opacity="0.35"/>
  <rect x="1548" y="658" width="200" height="10" rx="5" fill="#fbbf24" opacity="0.45"/>
