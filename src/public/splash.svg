  <rect x="428" y="560" width="80" height="12" rx="6" fill="#fbbf24" opacity="0.8"/>
  <rect x="428" y="586" width="180" height="10" rx="5" fill="#fbbf24" opacity="0.4"/>
  <rect x="428" y="608" width="140" height="10" rx="5" fill="#60a5fa" opacity="0.4"/>
  <rect x="428" y="630" width="160" height="10" rx="5" fill="#60a5fa" opacity="0.35"/>
