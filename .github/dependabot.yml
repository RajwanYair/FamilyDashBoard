version: 2
# Scope:
#   - GitHub Actions updates (root) — owned by Dependabot.
#   - Cloudflare Worker npm deps (/worker) — owned by Dependabot (real prod deps).
#   - Root npm deps — owned by Renovate (see renovate.json) for richer grouping
#     (TypeScript+@types, Vite+Vitest, ESLint family, etc.). Root dependencies
#     and package-lock.json are committed in this repository.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Jerusalem"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Jerusalem"
    commit-message:
      prefix: "chore(worker-deps)"
    labels:
      - "dependencies"
      - "worker"
    open-pull-requests-limit: 3
