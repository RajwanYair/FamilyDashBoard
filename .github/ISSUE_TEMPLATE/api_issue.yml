name: 🔧 API Issue
description: Report a broken or degraded API data source
title: "[API] "
labels: ["api", "bug", "triage"]
assignees:
  - RajwanYair
body:
  - type: markdown
    attributes:
      value: |
        Report issues with data sources (weather, news, stocks, etc.)

  - type: dropdown
    id: api
    attributes:
      label: Affected API / Data Source
      multiple: true
      options:
        - Open-Meteo (Weather + UV + Hourly)
        - Hebcal (Hebrew Dates / Shabbat / Holidays)
        - Yahoo Finance (Stocks)
        - RSS Feeds (News — 20 Hebrew sources)
        - ER-API / exchangerate-api (Currency)
        - Google Calendar (ICS)
        - Google Translate
        - tzevaadom.co.il (Red Alerts)
        - CORS Proxy (allorigins / codetabs / corsproxy.io)
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Issue Type
      options:
        - Data not loading (sync dot red)
        - Incorrect / stale data
        - Slow response
        - Rate limited
        - CORS error
        - API endpoint changed / offline
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's happening with the API?
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Network / Console Errors
      description: Open DevTools → Network tab or Console, paste errors
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Screenshot showing the broken section
