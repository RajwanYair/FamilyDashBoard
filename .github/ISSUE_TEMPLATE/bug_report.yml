name: 🐛 Bug Report
description: Report a bug in the Family Dashboard
title: "[BUG] "
labels: ["bug", "triage"]
assignees:
  - RajwanYair
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below.

  - type: dropdown
    id: section
    attributes:
      label: Section Affected
      description: Which dashboard section has the bug?
      multiple: true
      options:
        - Clock / Header
        - News Ticker
        - News (RSS Card)
        - Google Calendar
        - Stocks
        - Weather / Hourly Chart
        - Currency Exchange
        - Motivation / Quotes
        - Shabbat Times
        - Status Bar
        - Overall Layout / Theme
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
      placeholder: When I open the dashboard, the news ticker shows...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the issue
      placeholder: |
        1. Open BestDashBoard.html in Chrome
        2. Wait for data to load
        3. Observe the news section...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Edge
        - Safari
        - Samsung Internet
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g., Windows 11, Android 14, Tizen OS"

  - type: input
    id: display
    attributes:
      label: Display
      placeholder: "e.g., 55\" Samsung TV, 27\" monitor"

  - type: input
    id: resolution
    attributes:
      label: Resolution
      placeholder: "e.g., 1920x1080, 3840x2160"

  - type: textarea
    id: console
    attributes:
      label: Console Errors
      description: Paste any browser console errors (F12 → Console)
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag & drop screenshots if applicable

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical — Dashboard unusable
        - High — Major feature broken
        - Medium — Feature partially broken
        - Low — Cosmetic issue
    validations:
      required: true
