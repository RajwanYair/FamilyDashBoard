name: ✨ Feature Request
description: Suggest a new feature or enhancement for the Family Dashboard
title: "[FEATURE] "
labels: ["enhancement", "triage"]
assignees:
  - RajwanYair
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Help us understand what you need.

  - type: dropdown
    id: section
    attributes:
      label: Dashboard Section
      description: Which section does this affect?
      multiple: true
      options:
        - Clock / Header
        - News Ticker
        - News (RSS Card)
        - Google Calendar
        - Stocks
        - Weather / Hourly Chart
        - Currency Exchange
        - Motivation / Quotes
        - Shabbat Times
        - Status Bar
        - Theme / Design
        - Performance
        - New Section (describe below)
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Brief description of the feature
      placeholder: I'd like the dashboard to show...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this useful for the family dashboard?
      placeholder: This would help the family see...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should it work? Include mockups or examples if possible.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you've thought of?

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High — Daily use
        - Medium — Nice to have
        - Low — Someday
