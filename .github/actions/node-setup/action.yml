# =============================================================================
# node-setup — Reusable composite action for FamilyDashBoard CI
#
# Encapsulates the repeated checkout + setup-node + install-toolchain steps
# that every job in the CI matrix uses. Reduces workflow boilerplate and
# ensures all jobs share the same Node version and install procedure.
#
# Harvested from Wedding parallel project — adapted for FamilyDashBoard:
#   · Uses parent-level package-lock.json for npm cache key
#   · Runs .github/ci/install-tools.sh for shared-toolchain installation
#   · Supports optional node-version and install-args inputs
# =============================================================================
name: "Node Setup"
description: "Checkout, setup Node.js, and install FamilyDashBoard CI toolchain"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "24"
  install-args:
    description: "Extra arguments forwarded to the install-tools.sh step"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: "../package-lock.json"

    - name: Install CI toolchain
      shell: bash
      run: bash .github/ci/install-tools.sh ${{ inputs.install-args }}
