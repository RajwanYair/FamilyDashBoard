# =============================================================================
# PR labeler config — maps file paths to labels
# Used by: .github/workflows/auto-label.yml (actions/labeler)
# =============================================================================

dashboard:
  - changed-files:
      - any-glob-to-any-file: "BestDashBoard.html"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "CONTRIBUTING.md"
          - ".github/*.md"
          - ".github/instructions/**"
          - ".github/SECURITY.md"

copilot-config:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/copilot-instructions.md"
          - ".github/copilot/**"
          - ".github/agents/**"
          - ".github/prompts/**"
          - ".github/hooks/**"
          - ".github/instructions/**"

tests:
  - changed-files:
      - any-glob-to-any-file: "tests/**"

github-config:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/ISSUE_TEMPLATE/**"
          - ".github/PULL_REQUEST_TEMPLATE.md"
          - ".github/CODEOWNERS"
          - ".github/dependabot.yml"
          - ".github/labeler.yml"
          - ".github/release.yml"
