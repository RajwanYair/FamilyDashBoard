# =============================================================================
# CI — FamilyDashBoard v8 — Unified quality gate
# Typecheck · ESLint · Markdownlint · Vitest (Node 20/22/24) · Security · Build
# Runs on every push to main and all pull requests.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress CI run for the same branch/PR on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - run: npx tsc --noEmit

  lint:
    name: ESLint + Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - name: ESLint (0 warnings allowed)
        run: npx eslint src tests --max-warnings 0
      - name: Markdownlint
        run: npx markdownlint-cli2 "**/*.md" "#**/node_modules/**" "#**/coverage/**"

  unit-tests:
    name: Vitest (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - run: npx vitest run --reporter=verbose

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - name: npm audit (high+critical)
        run: npm audit --audit-level=high
      - name: Scan for hardcoded secrets
        run: |
          echo "🔍 Scanning for potential secrets in src/..."
          FOUND=0
          for PATTERN in 'api[_-]?key\s*[:=]' 'apiKey\s*[:=]' 'secret\s*[:=]' 'password\s*[:=]' 'Bearer\s+[A-Za-z0-9]{20,}'; do
            if grep -rEn "$PATTERN" src/ --include="*.ts" 2>/dev/null | grep -qv '//.*:'; then
              echo "::error::Potential secret pattern found: $PATTERN"
              grep -rEn "$PATTERN" src/ --include="*.ts" | grep -v '//.*:'
              FOUND=1
            fi
          done
          [ "$FOUND" -eq 0 ] && echo "✅ No hardcoded secrets detected"
          [ "$FOUND" -eq 1 ] && exit 1
      - name: Scan for dangerous JS patterns
        run: |
          echo "🔍 Scanning for dangerous JS patterns in src/..."
          FAILED=0
          if grep -rn "eval(" src/ --include="*.ts" 2>/dev/null; then
            echo "::error::eval() usage detected in src/ — security risk"
            FAILED=1
          fi
          if grep -rn "document\.write(" src/ --include="*.ts" 2>/dev/null; then
            echo "::error::document.write() detected in src/ — security risk"
            FAILED=1
          fi
          [ "$FAILED" -eq 0 ] && echo "✅ No dangerous patterns found"
          exit $FAILED

  worker-tests:
    name: Worker Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - name: Worker tests (gate for CF Worker regressions)
        run: npx vitest run tests/unit/worker/ --reporter=verbose

  build:
    name: Production Build + Size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [typecheck, lint, unit-tests, worker-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - name: Build
        run: npx vite build
      - name: Bundle size check
        run: node scripts/check-bundle-size.mjs
