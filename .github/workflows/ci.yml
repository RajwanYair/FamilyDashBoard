# =============================================================================
# CI — FamilyDashBoard
# HTML validation, security scan, Lighthouse audit, link check
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (HTML + CSS + JS + Markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install linters
        run: npm install -g htmlhint stylelint eslint markdownlint-cli

      - name: Lint HTML
        run: htmlhint --config .htmlhintrc BestDashBoard.html

      - name: Extract and lint CSS
        run: |
          sed -n '/<style>/,/<\/style>/p' BestDashBoard.html | sed '1d;$d' > .extracted.css
          stylelint --config .stylelintrc.json --max-warnings 0 .extracted.css
          rm .extracted.css

      - name: Extract and lint JS
        run: |
          sed -n '/<script>/,/<\/script>/p' BestDashBoard.html | sed '1d;$d' > .extracted.js
          eslint --config eslint.config.mjs --max-warnings 0 .extracted.js sw.js tests/dashboard.test.mjs
          rm .extracted.js

      - name: Lint Markdown
        run: markdownlint-cli '*.md'

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests
        run: node --test --test-timeout=500000 tests/dashboard.test.mjs

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for hardcoded secrets
        run: |
          echo "🔍 Scanning for potential secrets..."
          if grep -rn "api_key\|apiKey\|secret\|password\|token" BestDashBoard.html --include="*.html" | grep -v "//.*api_key\|//.*secret"; then
            echo "::warning::Potential secrets found in source code"
          else
            echo "✅ No hardcoded secrets detected"
          fi

      - name: Check for dangerous patterns
        run: |
          echo "🔍 Scanning for dangerous JavaScript patterns..."
          FAILED=0
          if grep -n "eval(" BestDashBoard.html; then
            echo "::error::eval() usage detected — potential security risk"
            FAILED=1
          fi
          if grep -n "document\.write(" BestDashBoard.html; then
            echo "::error::document.write() detected — potential security risk"
            FAILED=1
          fi
          if grep -Pn "\.innerHTML\s*=" BestDashBoard.html | grep -v "//"; then
            echo "::warning::innerHTML assignment detected — verify sanitization"
          fi
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "✅ No dangerous patterns found"

  link-check:
    name: Check External Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract and validate URLs
        run: |
          echo "🔍 Checking external URLs..."
          grep -oP 'https?://[^\s"'"'"'<>]+' BestDashBoard.html | sort -u | while read -r url; do
            CODE=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 "$url" 2>/dev/null || echo "000")
            if [ "$CODE" -ge 400 ] || [ "$CODE" = "000" ]; then
              echo "::warning::Broken link ($CODE): $url"
            fi
          done
          echo "✅ Link check complete"

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install http-server
        run: npm install -g http-server

      - name: Start server
        run: http-server . -p 8080 &

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: "http://localhost:8080/BestDashBoard.html"
          temporaryPublicStorage: true

  size-check:
    name: File Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check dashboard file size
        run: |
          SIZE=$(stat -c%s BestDashBoard.html)
          SIZE_KB=$((SIZE / 1024))
          echo "📦 BestDashBoard.html: ${SIZE_KB}KB"
          if [ "$SIZE_KB" -gt 200 ]; then
            echo "::warning::Dashboard file is ${SIZE_KB}KB — consider if it's growing too large"
          fi
