# =============================================================================
# CI — FamilyDashBoard v14 — Unified quality gate
# Typecheck · ESLint · Markdownlint · Vitest (Node 24) · Security · Build
# Runs on every push to main and all pull requests.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
    # Skip CI for AI customization / documentation-only pushes that cannot
    # affect runtime behaviour. Harvested from CrossTide parallel project.
    paths-ignore:
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".github/agents/**"
      - ".github/copilot/**"
      - ".github/copilot-instructions.md"
      - ".github/AGENTS.md"
      - "tooling/mcp/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".github/agents/**"
      - ".github/copilot/**"
      - ".github/copilot-instructions.md"
      - ".github/AGENTS.md"
      - "tooling/mcp/**"
  workflow_dispatch:

# Cancel any in-progress CI run for the same branch/PR on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Opt into Node.js 24 for GitHub Actions JavaScript runtime to suppress
# Node.js 20 deprecation warnings (default switches to 24 in June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "../package-lock.json"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - run: npx tsc --noEmit
      - name: SW typecheck
        run: npx tsc --project tsconfig.sw.json --noEmit
      - name: Worker typecheck
        run: npx tsc --project worker/tsconfig.json --noEmit
      - name: Scripts typecheck (@ts-check opt-in)
        run: npx tsc --project tsconfig.scripts.json --noEmit

  lint:
    name: ESLint + Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "../package-lock.json"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - name: oxlint (fast Rust pre-pass, errors only)
        run: npx oxlint --quiet src tests
      - name: ESLint (0 warnings allowed)
        run: npx eslint src tests --max-warnings 0
      - name: Prettier format check
        run: npx prettier --check .
      - name: Markdownlint
        run: npx markdownlint-cli2 "**/*.md" "#**/node_modules/**" "#**/coverage/**" "#**/dist/**"
      - name: Lint instruction files
        run: node scripts/lint-instructions.mjs

  unit-tests:
    name: Vitest (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "../package-lock.json"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - name: Forbid focused/skipped tests
        run: node scripts/check-test-focus-skip.mjs
      - run: npx vitest run

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "../package-lock.json"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - name: npm audit (high+critical)
        run: |
          npm install --package-lock-only --ignore-scripts --silent
          npm audit --audit-level=high
      - name: OWASP Top 10 pattern scan
        run: node scripts/check-owasp.mjs
      - name: Trusted Types enforcement audit
        run: node scripts/check-trusted-types.mjs
      - name: CSP wildcard review
        run: node scripts/check-csp-wildcards.mjs
      - name: GitHub Actions SHA-pinned check
        run: node scripts/check-actions-pinned.mjs
      - name: npm ignore-scripts gate
        run: node scripts/check-npm-ignore-scripts.mjs

  worker-tests:
    name: Worker Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "../package-lock.json"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - name: Worker tests (gate for CF Worker regressions)
        run: npx vitest run tests/unit/worker/ --reporter=verbose

  build:
    name: Production Build + Size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [typecheck, lint, unit-tests, worker-tests, security]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "../package-lock.json"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - name: Build
        run: npx vite build
      - name: Bundle size check
        run: node scripts/check-bundle-size.mjs
      - name: Per-card bundle delta check
        run: node scripts/check-card-bundle-delta.mjs
      - name: SW version check
        run: node scripts/check-sw-version.mjs
      - name: Doc/instruction version consistency check
        run: node scripts/check-version-consistency.mjs
      - name: Worker-client / OpenAPI sync check
        run: node scripts/check-worker-client.mjs
      - name: ADR index staleness check
        run: node scripts/check-adr-index.mjs
      - name: OpenAPI x-kv-ttl annotation check
        run: node scripts/check-openapi-ttl.mjs
      - name: Release notes CHANGELOG check
        run: node scripts/check-release-notes.mjs
      - name: Reading-level audit
        run: node scripts/check-reading-level.mjs
      - name: Mermaid diagram validation
        run: node scripts/check-mermaid.mjs
      - name: Container-query audit
        run: node scripts/check-container-queries.mjs
      - name: Module boundary lint (D12 + D12-cross)
        run: node scripts/check-module-boundaries.mjs
      - name: Smart contrast audit (WCAG)
        run: node scripts/check-smart-contrast.mjs
      - name: Dead exports check
        run: node scripts/check-dead-exports.mjs --max-allowed 5
      - name: Build artifacts untracked check
        run: node scripts/check-build-artifacts-untracked.mjs

  lighthouse:
    name: Lighthouse CI (Accessibility + Performance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [build]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "../package-lock.json"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - name: Build for Lighthouse
        run: npx vite build
      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    # Only run on pull requests — this action compares base vs head snapshots
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Fail on any high or critical severity vulnerability in new deps
          fail-on-severity: high
          # Comment on the PR with a summary of added/removed dependencies
          comment-summary-in-pr: always

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Only generate SBOM on main branch pushes (not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "../package-lock.json"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - name: Generate SBOM (CycloneDX JSON)
        run: |
          npm install --package-lock-only --ignore-scripts --silent
          npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file sbom.json --package-lock-only --ignore-npm-errors
      - name: Verify SBOM was created
        run: |
          if [ ! -f sbom.json ]; then
            echo "::error::SBOM generation failed — sbom.json not found"
            exit 1
          fi
          echo "✅ SBOM generated: $(wc -c < sbom.json) bytes"
          # Verify it's valid JSON
          node -e "const s=require('fs').readFileSync('sbom.json','utf8'); JSON.parse(s); console.log('✅ SBOM is valid JSON');"
      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90
