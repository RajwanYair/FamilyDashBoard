# =============================================================================
# CI — FamilyDashBoard v6+ — Cross-cutting quality gates
# Runs on ALL pushes (no path filter) to catch docs, config, and repo-wide issues.
# TypeScript / Vite build checks live in ci-v6.yml (path-filtered).
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-docs:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint Markdown files
        run: npx --yes markdownlint-cli@0.44.0 "*.md" ".github/**/*.md"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh

      - name: npm audit (high+critical)
        run: npm audit --audit-level=high

      - name: Scan for hardcoded secrets
        run: |
          echo "🔍 Scanning for potential secrets in src/..."
          FOUND=0
          for PATTERN in 'api[_-]?key\s*[:=]' 'apiKey\s*[:=]' 'secret\s*[:=]' 'password\s*[:=]' 'Bearer\s+[A-Za-z0-9]{20,}'; do
            if grep -rEn "$PATTERN" src/ --include="*.ts" 2>/dev/null | grep -qv '//.*:'; then
              echo "::warning::Potential secret pattern found: $PATTERN"
              grep -rEn "$PATTERN" src/ --include="*.ts" | grep -v '//.*:'
              FOUND=1
            fi
          done
          [ "$FOUND" -eq 0 ] && echo "✅ No hardcoded secrets detected"

      - name: Scan for dangerous JS patterns
        run: |
          echo "🔍 Scanning for dangerous JS patterns in src/..."
          FAILED=0
          if grep -rn "eval(" src/ --include="*.ts" 2>/dev/null; then
            echo "::error::eval() usage detected in src/ — security risk"
            FAILED=1
          fi
          if grep -rn "document\.write(" src/ --include="*.ts" 2>/dev/null; then
            echo "::error::document.write() detected in src/ — security risk"
            FAILED=1
          fi
          if grep -rEn '\.innerHTML\s*=\s*(?!["'"'"'`]*)' src/ --include="*.ts" 2>/dev/null | grep -Ev '(//|\.textContent)'; then
            echo "::warning::innerHTML assignment detected in src/ — verify no unsanitized user data"
          fi
          [ "$FAILED" -eq 0 ] && echo "✅ No dangerous patterns found"
          exit $FAILED

  bundle-size:
    name: Bundle Size Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh

      - name: Build
        run: npx vite build

      - name: Enforce size budget
        run: |
          echo "## 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          ls -lhS dist/assets/ >> $GITHUB_STEP_SUMMARY

          JS_GZ=$(find dist/assets -name '*.js' -exec cat {} + | gzip -c | wc -c)
          CSS_GZ=$(find dist/assets -name '*.css' -exec cat {} + | gzip -c | wc -c)
          JS_KB=$((JS_GZ / 1024))
          CSS_KB=$((CSS_GZ / 1024))

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**JS gzip:** ${JS_KB} KB  |  **CSS gzip:** ${CSS_KB} KB" >> $GITHUB_STEP_SUMMARY

          echo "JS gzipped: ${JS_KB} KB"
          echo "CSS gzipped: ${CSS_KB} KB"

          [ "$JS_KB" -gt 40 ] && echo "::warning::JS bundle exceeds 40 KB gz (${JS_KB} KB)"
          [ "$CSS_KB" -gt 18 ] && echo "::warning::CSS bundle exceeds 18 KB gz (${CSS_KB} KB)"
          echo "✅ Size check complete"
