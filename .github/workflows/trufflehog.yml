# =============================================================================
# TruffleHog — Secret Scanning
#
# Scans the full git history for accidentally committed secrets (API keys,
# tokens, connection strings). Only verified findings are reported to reduce
# noise — unverified pattern matches are skipped.
#
# Harvested from Wedding parallel project — adapted for FamilyDashBoard.
#
# Note: FamilyDashBoard is a static client-only dashboard with no auth or
# backend, so true secret exposure is unlikely. This workflow still protects
# against API key leaks (weather, stocks, news) and CI token accidents.
# =============================================================================
name: TruffleHog

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trufflehog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Verified secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: TruffleHog OSS — only verified findings
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          path: ./
          # Push events: compare before..after to avoid BASE==HEAD false-failure.
          # PR events: compare PR base SHA to PR head SHA.
          # Schedule/dispatch: base='' scans full history (safe, no alert fatigue).
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
          head: ${{ github.sha }}
          extra_args: --only-verified
