# =============================================================================
# Auto-close issues referenced in merged PRs
# Handles both "Closes #N" and smart matching by title/commit
# =============================================================================
name: Auto Close Issues

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  close-issues:
    name: Close Related Issues
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 1. Find issues referenced in PR body/title with keywords
            const keywords = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const text = `${pr.title} ${pr.body || ''}`;
            const referenced = new Set();
            let match;
            while ((match = keywords.exec(text)) !== null) {
              referenced.add(parseInt(match[1]));
            }

            // 2. Also check commit messages in the PR
            const commits = await github.rest.pulls.listCommits({
              owner, repo,
              pull_number: pr.number,
              per_page: 50
            });
            for (const c of commits.data) {
              const msg = c.commit.message || '';
              while ((match = keywords.exec(msg)) !== null) {
                referenced.add(parseInt(match[1]));
              }
            }

            // 3. Close each referenced issue with a comment
            for (const issueNum of referenced) {
              try {
                // Verify issue exists and is open
                const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNum });
                if (issue.data.state === 'open') {
                  await github.rest.issues.createComment({
                    owner, repo,
                    issue_number: issueNum,
                    body: `✅ Implemented in PR #${pr.number} by @${pr.user.login}.\n\n**Merge commit:** [\`${pr.merge_commit_sha?.substring(0,7)}\`](https://github.com/${owner}/${repo}/commit/${pr.merge_commit_sha})`
                  });
                  await github.rest.issues.update({
                    owner, repo,
                    issue_number: issueNum,
                    state: 'closed',
                    state_reason: 'completed'
                  });
                  core.info(`Closed issue #${issueNum}`);
                }
              } catch (e) {
                core.warning(`Could not close issue #${issueNum}: ${e.message}`);
              }
            }

            if (referenced.size === 0) {
              core.info('No issue references found in PR — nothing to close.');
            } else {
              core.info(`Closed ${referenced.size} issue(s): ${[...referenced].map(n => '#' + n).join(', ')}`);
            }

            // 4. Add summary
            const summary = referenced.size > 0
              ? `## ✅ Auto-Closed Issues\n${[...referenced].map(n => '- #' + n).join('\n')}`
              : '## ℹ️ No issues were auto-closed\nNo `Closes #N` / `Fixes #N` references found in PR title, body, or commits.';
            await core.summary.addRaw(summary).write();
