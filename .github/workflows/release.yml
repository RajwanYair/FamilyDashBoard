# =============================================================================
# Release — Build v6 and attach dist + PWA files to GitHub Releases
# Triggered by version tags: vX.Y.Z
# =============================================================================
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Production build
        run: npx vite build

      - name: Package dist
        run: zip -r dist.zip dist/ -x "dist/**/*.map"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## 🚀 Deploy
            Deployed automatically to GitHub Pages on push to `main`.
            To self-host: extract `dist.zip` and serve the `dist/` folder from any static host.
          files: |
            dist.zip
            sw.js
            manifest.json
            icon.svg
