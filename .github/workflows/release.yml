# =============================================================================
# Release — Build and attach dist + PWA files to GitHub Releases
# Triggered by version tags: vX.Y.Z
# =============================================================================
name: Release
run-name: Release · ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build & Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh

      - name: Full repository quality gate
        run: npm run check

      - name: GitHub Actions SHA-pinned check
        run: node scripts/check-actions-pinned.mjs

      - name: npm ignore-scripts gate
        run: node scripts/check-npm-ignore-scripts.mjs

      - name: Sigstore provenance check
        run: node scripts/check-sigstore.mjs

      - name: Reproducible build dry-run
        run: node scripts/check-reproducible.mjs --dry-run

      - name: Production build
        run: npm run build

      - name: Bundle size check
        run: npm run check:bundle

      - name: Per-card bundle delta check
        run: npm run check:card-bundle

      - name: Release checklist in step summary (V13-OPS)
        run: node scripts/release-checklist.mjs

      - name: Release readiness report (V13-OPS)
        run: node scripts/release-report.mjs --no-gates | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package dist
        run: zip -r dist.zip dist/ -x "dist/**/*.map"

      - name: Generate checksums
        run: |
          sha256sum dist.zip > dist.zip.sha256
          sha256sum sw.js >> dist.zip.sha256
          sha256sum dist/icon.svg >> dist.zip.sha256
          cat dist.zip.sha256

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.3.2
        with:
          generate_release_notes: true
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## 🚀 Deploy
            Deployed automatically to GitHub Pages on push to `main`.
            To self-host: extract `dist.zip` and serve the `dist/` folder from any static host.
          files: |
            dist.zip
            dist.zip.sha256
            dist.zip.bundle
            sw.js
            sw.js.bundle
            dist/icon.svg

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist.zip

      # ── Sigstore cosign keyless signing ─────
      # Signs dist.zip and sw.js using GitHub OIDC identity (no long-lived key).
      # Verification: cosign verify-blob --bundle=dist.zip.bundle
      #   --certificate-identity-regexp=".*"
      #   --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
      #   dist.zip
      # SHA-pin: verify against sigstore/cosign-installer releases before next tag.
      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign artefacts with Cosign
        run: |
          cosign sign-blob --bundle=dist.zip.bundle --yes dist.zip
          cosign sign-blob --bundle=sw.js.bundle --yes sw.js
          echo "=== Cosign bundle summary ===" >> "$GITHUB_STEP_SUMMARY"
          echo "dist.zip signed: dist.zip.bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "sw.js signed: sw.js.bundle" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate rebuilder manifest
        run: node scripts/check-reproducible.mjs
