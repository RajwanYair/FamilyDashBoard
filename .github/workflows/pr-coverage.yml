# PR Coverage Delta Bot — Sprint 102 (V14-FOUNDATIONS)
#
# Posts a single sticky comment on each PR with the absolute coverage of the
# PR head, and — when a baseline artefact from `main` is available — the
# delta vs that baseline. Zero SaaS dependency: own action, GitHub API only.
#
# Baseline storage: every push to `main` uploads `coverage-summary.json` as
# a workflow artefact named `coverage-baseline`. PR runs use `gh run download`
# to fetch the latest one. If none exists yet (first run after merge), the
# delta column is rendered as "—".
name: PR Coverage Delta

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage Delta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh

      - name: Run coverage
        run: npx vitest run --coverage

      - name: Locate coverage-summary.json
        id: locate
        run: |
          # Vitest writes to $TEMP/coverage on the agent (see vitest.config.ts).
          SUMMARY=$(find "${RUNNER_TEMP}" /tmp -name coverage-summary.json -path '*/coverage/*' 2>/dev/null | head -n 1)
          if [ -z "$SUMMARY" ]; then
            echo "::error::coverage-summary.json not found"
            exit 1
          fi
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          cp "$SUMMARY" ./coverage-summary.json

      - name: Upload baseline (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8 # v4.6.2
        with:
          name: coverage-baseline
          path: coverage-summary.json
          retention-days: 30

      - name: Download baseline (PR only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch the most recent successful run of THIS workflow on main.
          RUN_ID=$(gh run list \
            --workflow pr-coverage.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId' || echo "")
          if [ -z "$RUN_ID" ]; then
            echo "No baseline run found on main yet — first PR after enabling the bot."
            exit 0
          fi
          gh run download "$RUN_ID" -n coverage-baseline -D ./baseline || true

      - name: Compute delta and post comment (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v8.0.0
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const head = JSON.parse(fs.readFileSync("coverage-summary.json", "utf8")).total;
            let base = null;
            const basePath = path.join("baseline", "coverage-summary.json");
            if (fs.existsSync(basePath)) {
              base = JSON.parse(fs.readFileSync(basePath, "utf8")).total;
            }
            const fmt = (n) => n.toFixed(2) + "%";
            const delta = (h, b) => {
              if (b == null) return "—";
              const d = h - b;
              const sign = d > 0 ? "+" : "";
              const icon = d > 0.05 ? "🟢" : d < -0.05 ? "🔴" : "⚪";
              return `${icon} ${sign}${d.toFixed(2)}%`;
            };
            const row = (label, key) => {
              const h = head[key].pct;
              const b = base ? base[key].pct : null;
              return `| ${label} | ${fmt(h)} | ${b == null ? "—" : fmt(b)} | ${delta(h, b)} |`;
            };
            const body = [
              "<!-- pr-coverage-delta -->",
              "### 📊 Coverage Delta",
              "",
              "| Metric | PR | Base (main) | Δ |",
              "| --- | --- | --- | --- |",
              row("Statements", "statements"),
              row("Branches", "branches"),
              row("Functions", "functions"),
              row("Lines", "lines"),
              "",
              base
                ? "_Compared against the latest `coverage-baseline` artefact from `main`._"
                : "_No baseline yet — first run after enabling the bot. Subsequent PRs will show Δ._",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) =>
              c.user?.type === "Bot" && c.body?.startsWith("<!-- pr-coverage-delta -->"),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
