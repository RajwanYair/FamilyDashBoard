# =============================================================================
# Deploy Cloudflare Worker — FamilyDashBoard API
# Deploys worker/src/index.ts via Wrangler on push to main (worker/** only).
# Requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets in repo.
# =============================================================================
name: Deploy Worker
run-name: Deploy Worker · ${{ github.ref_name }} · @${{ github.actor }}

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Wrangler Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: TypeScript check
        working-directory: worker
        run: npm run typecheck

      - name: Deploy via Wrangler
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
