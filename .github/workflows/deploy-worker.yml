# =============================================================================
# Deploy Cloudflare Worker — FamilyDashBoard API
# Deploys worker/src/index.ts via Wrangler on push to main (worker/** only).
# Requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets in repo.
# =============================================================================
name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Wrangler Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: worker/package.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: TypeScript check
        working-directory: worker
        run: npx tsc --noEmit

      - name: Deploy via Wrangler
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production
