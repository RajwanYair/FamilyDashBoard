# =============================================================================
# Deploy Cloudflare Worker — FamilyDashBoard API
# Deploys worker/src/index.ts via Wrangler on push to main (worker/** only).
# Requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets in repo.
# =============================================================================
name: Deploy Worker
run-name: Deploy Worker · ${{ github.ref_name }} · @${{ github.actor }}

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Wrangler Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci --ignore-scripts

      - name: TypeScript check
        working-directory: worker
        run: npm run typecheck

      - name: Deploy via Wrangler
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
