# =============================================================================
# Stale Issue & PR Management — FamilyDashBoard
#
# Automatically marks old issues and PRs as stale and closes them after
# additional inactivity. Keeps the issue tracker healthy without manual triage.
#
# Timing (personal project — generous windows):
#   Issues: stale after 90 days, closed after 21 more days
#   PRs:    stale after 30 days, closed after 7 more days
#
# Exempt labels: pinned · security · P0 — these are never auto-closed.
#
# Harvested from CrossTide parallel project — adapted for FamilyDashBoard.
# =============================================================================
name: Manage Stale Issues

on:
  schedule:
    # Run daily at 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close stale issues & PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/stale@v9 # pin-allow: initial addition — Dependabot will SHA-pin
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            activity in 90 days. It will be closed in 21 days if no further activity
            occurs. If this is still relevant, please comment to keep it open.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not had
            activity in 30 days. It will be closed in 7 days if no further activity
            occurs. Please rebase or comment if you plan to continue this work.
          close-issue-message: "Closed as stale. Reopen if still relevant."
          close-pr-message: "Closed as stale. Reopen if still relevant."
          days-before-issue-stale: 90
          days-before-pr-stale: 30
          days-before-issue-close: 21
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          # Never auto-close pinned, security-sensitive, or high-priority issues
          exempt-issue-labels: "pinned,security,P0,bug"
          exempt-pr-labels: "pinned,security"
          # Limit operations per run to avoid rate-limiting
          operations-per-run: 30
