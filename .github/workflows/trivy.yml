# =============================================================================
# Trivy Scan — FamilyDashBoard
#
# Filesystem CVE scan + IaC/workflow misconfig scan.
# Catches vulnerable transitive dependencies and workflow misconfigurations.
# Uploads SARIF to the GitHub Security tab (Code Scanning).
#
# Harvested from Wedding parallel project — adapted for FamilyDashBoard:
#   · Scans the repo filesystem (npm deps + workflow YAML)
#   · Uses HIGH,CRITICAL severity filter (TV dashboard; no credentials at rest)
#   · exit-code 0 — findings surfaced via SARIF, not by blocking CI
#   · Weekly Monday + push to main + all PRs
# =============================================================================
name: Trivy Scan

on:
  schedule:
    - cron: "37 6 * * 1" # Mondays 06:37 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Trivy filesystem + config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy (filesystem — npm deps)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # exit 0 — surfaced via SARIF upload, not by failing CI directly
          exit-code: "0"

      - name: Run Trivy (config — workflow / IaC misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload filesystem SARIF
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload config SARIF
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
