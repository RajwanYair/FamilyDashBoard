# =============================================================================
# CI v6 — FamilyDashBoard (Vite + TypeScript)
# Type-check, lint, test, build, security scan, size check
# =============================================================================
name: CI v6

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - run: npx tsc --noEmit

  lint:
    name: ESLint (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - run: npx eslint src/ sw.js --max-warnings 0

  unit-tests:
    name: Vitest (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - run: npx vitest run --reporter=verbose

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-tests]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh
      - run: npx vite build

      - name: Check bundle size
        run: |
          echo "## 📦 Bundle Size" >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lhS dist/assets/ >> $GITHUB_STEP_SUMMARY

          # Check total JS size (gzipped)
          TOTAL_JS=$(find dist/assets -name '*.js' -exec cat {} + | gzip -c | wc -c)
          TOTAL_JS_KB=$((TOTAL_JS / 1024))
          echo "Total JS (gzipped): ${TOTAL_JS_KB}KB"
          if [ "$TOTAL_JS_KB" -gt 60 ]; then
            echo "::warning::JS bundle exceeds 60KB gzipped (${TOTAL_JS_KB}KB)"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check for dangerous patterns
        run: |
          echo "🔍 Scanning TypeScript source for dangerous patterns..."
          FAILED=0
          if grep -rn "eval(" src/ --include="*.ts"; then
            echo "::error::eval() detected"; FAILED=1
          fi
          if grep -rn "document\.write(" src/ --include="*.ts"; then
            echo "::error::document.write() detected"; FAILED=1
          fi
          if grep -rn "innerHTML\s*=" src/ --include="*.ts" | grep -v "//"; then
            echo "::warning::innerHTML usage detected — verify sanitization"
          fi
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "✅ No dangerous patterns found"
