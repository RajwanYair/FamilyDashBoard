# =============================================================================
# Sync Labels — FamilyDashBoard
#
# Keeps the GitHub repository labels in sync with .github/labels.yml.
# Runs automatically when labels.yml changes, also available via manual
# dispatch to force a full sync.
#
# Harvested from ExplorerLens.io parallel project.
# =============================================================================
name: Sync Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: sync-labels
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    name: Sync repo labels from labels.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Sync labels
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          config-file: .github/labels.yml
          # Keep any labels created manually in the GitHub UI
          delete-other-labels: false
          token: ${{ secrets.GITHUB_TOKEN }}
