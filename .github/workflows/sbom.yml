# =============================================================================
# CycloneDX SBOM Generation — FamilyDashBoard
#
# Generates a Software Bill of Materials (SBOM) in both CycloneDX JSON and XML
# formats. Uploaded as workflow artefacts for supply-chain audits, SLSA
# compliance, and downstream consumers.
#
# Separate from pr-sbom-diff.yml which diffs PR-level dependency changes.
# This workflow captures a complete production-dependency snapshot on every
# release tag and weekly for ongoing supply-chain visibility.
#
# Harvested from Wedding parallel project — adapted for FamilyDashBoard:
#   · Production deps only (--omit dev)
#   · Runs on release tags (v*) + weekly Monday + manual dispatch
#   · Artefacts retained 90 days
# =============================================================================
name: SBOM (CycloneDX)

on:
  schedule:
    - cron: "31 6 * * 1" # Mondays 06:31 UTC
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Generate lock file (required by @cyclonedx/cyclonedx-npm)
        # Must run BEFORE installing devtools so the lock file only reflects
        # actual package.json dependencies (zero for FamilyDashBoard).
        # @cyclonedx/cyclonedx-npm --package-lock-only requires a lock file.
        run: npm install --package-lock-only --ignore-scripts

      - name: Install CI toolchain (production deps only)
        run: |
          # FamilyDashBoard shares node_modules from parent MyScripts/
          # In CI we install just what we need for SBOM generation
          npm install --no-save --no-package-lock --ignore-scripts \
            "@cyclonedx/cyclonedx-npm"

      - name: Generate SBOM (JSON)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file sbom.cdx.json \
            --omit dev \
            --package-lock-only

      - name: Generate SBOM (XML)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-format XML \
            --output-file sbom.cdx.xml \
            --omit dev \
            --package-lock-only

      - name: Upload artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyclonedx-sbom
          path: |
            sbom.cdx.json
            sbom.cdx.xml
          retention-days: 90
