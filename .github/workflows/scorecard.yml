# =============================================================================
# OpenSSF Scorecard — FamilyDashBoard
#
# Measures the project's supply-chain security posture against the OpenSSF
# Scorecard rubric (branch protection, dependency updates, CI tests, pinned
# dependencies, token permissions, etc.).
#
# Results are published to the GitHub Security tab as SARIF and contribute to
# the public Scorecard badge.
#
# Harvested from CrossTide parallel project — adapted for FamilyDashBoard.
# =============================================================================
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"

# Scorecard requires broad read permissions + id-token for OIDC publish
permissions: read-all

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          sarif_file: results.sarif
