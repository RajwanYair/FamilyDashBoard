# =============================================================================
# Visual Regression Baselines — FamilyDashBoard
#
# Playwright visual-regression snapshots are platform-specific (*-linux.png)
# and must be generated on the same OS that the E2E CI job runs (Ubuntu).
# Local Windows/macOS development cannot produce compatible baselines.
#
# This workflow runs on demand (workflow_dispatch), updates the Linux snapshots
# on the target branch, and commits them back via github-actions[bot].
#
# Trigger: manual — run this after any intentional UI change to refresh
# the visual baseline before the next E2E run.
#
# Harvested from Wedding parallel project — adapted for FamilyDashBoard:
#   · Targets tests/e2e/visual-regression.spec.ts
#   · Builds with standard GitHub Pages base (/FamilyDashBoard/)
#   · Installs chromium + firefox + webkit for full cross-browser baseline
# =============================================================================
name: Visual Regression Baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update baselines on"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  update-baselines:
    name: Refresh VR Baselines (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install CI toolchain
        run: bash .github/ci/install-tools.sh

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build production bundle
        run: npx vite build

      - name: Update visual snapshots
        run: npx playwright test tests/e2e/visual-regression.spec.ts --update-snapshots
        continue-on-error: false

      - name: Commit and push baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual-regression.spec.ts-snapshots/ || true
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "test(e2e): refresh visual regression baselines [skip ci]"
            git push origin HEAD:${{ inputs.branch }}
          fi
