# =============================================================================
# Auto-create a tracking issue for every push to main
# =============================================================================
name: Track Changes

on:
  push:
    branches: [main]
    paths:
      - "BestDashBoard.html"
      - "Dockerfile"
      - "nginx.conf"

permissions:
  issues: write
  contents: read

jobs:
  create-issue:
    name: Create Tracking Issue
    runs-on: ubuntu-latest
    # Skip Dependabot commits and merge commits
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changes
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "initial commit")
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get commit info
        id: commit
        run: |
          MSG=$(git log -1 --pretty=format:"%s")
          BODY=$(git log -1 --pretty=format:"%b")
          SHA=$(git log -1 --pretty=format:"%h")
          AUTHOR=$(git log -1 --pretty=format:"%an")
          echo "msg=$MSG" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Determine label from commit prefix
        id: label
        run: |
          MSG="${{ steps.commit.outputs.msg }}"
          if [[ "$MSG" == feat:* ]] || [[ "$MSG" == feat\(* ]]; then
            echo "label=enhancement" >> $GITHUB_OUTPUT
            echo "emoji=✨" >> $GITHUB_OUTPUT
          elif [[ "$MSG" == fix:* ]] || [[ "$MSG" == fix\(* ]]; then
            echo "label=bug" >> $GITHUB_OUTPUT
            echo "emoji=🐛" >> $GITHUB_OUTPUT
          elif [[ "$MSG" == style:* ]] || [[ "$MSG" == style\(* ]]; then
            echo "label=ui" >> $GITHUB_OUTPUT
            echo "emoji=🎨" >> $GITHUB_OUTPUT
          elif [[ "$MSG" == docs:* ]] || [[ "$MSG" == docs\(* ]]; then
            echo "label=documentation" >> $GITHUB_OUTPUT
            echo "emoji=📖" >> $GITHUB_OUTPUT
          elif [[ "$MSG" == ci:* ]] || [[ "$MSG" == ci\(* ]]; then
            echo "label=ci" >> $GITHUB_OUTPUT
            echo "emoji=⚙️" >> $GITHUB_OUTPUT
          elif [[ "$MSG" == chore:* ]] || [[ "$MSG" == chore\(* ]]; then
            echo "label=maintenance" >> $GITHUB_OUTPUT
            echo "emoji=🧹" >> $GITHUB_OUTPUT
          else
            echo "label=change" >> $GITHUB_OUTPUT
            echo "emoji=📝" >> $GITHUB_OUTPUT
          fi

      - name: Create tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const msg = `${{ steps.commit.outputs.msg }}`;
            const sha = `${{ steps.commit.outputs.sha }}`;
            const author = `${{ steps.commit.outputs.author }}`;
            const label = `${{ steps.label.outputs.label }}`;
            const emoji = `${{ steps.label.outputs.emoji }}`;
            const files = `${{ steps.changes.outputs.files }}`;
            const body_text = `${{ steps.commit.outputs.body }}`;

            const body = [
              `## ${emoji} Change Deployed`,
              ``,
              `**Commit:** [\`${sha}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})`,
              `**Author:** ${author}`,
              `**Branch:** \`main\``,
              ``,
              `### Description`,
              msg,
              body_text ? `\n${body_text}` : '',
              ``,
              `### Files Changed`,
              '```',
              files,
              '```',
              ``,
              `---`,
              `*This issue was automatically created by the [Track Changes](https://github.com/${{ github.repository }}/actions/workflows/track-changes.yml) workflow.*`,
              `*Close this issue once reviewed. ✅*`,
            ].join('\n');

            // Ensure label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label
              });
            } catch (e) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'ededed'
              });
            }

            // Ensure 'deployed' label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'deployed'
              });
            } catch (e) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'deployed',
                color: '0e8a16',
                description: 'Change deployed to production'
              });
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${emoji} ${msg}`,
              body: body,
              labels: [label, 'deployed'],
              assignees: ['RajwanYair']
            });
