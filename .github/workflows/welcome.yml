# =============================================================================
# Greet first-time contributors on their first issue or PR
# =============================================================================
name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to FamilyDashBoard! Thanks for opening your first issue.

            A maintainer will review this shortly. In the meantime:
            - 📖 Check the [README](https://github.com/RajwanYair/FamilyDashBoard#readme) for setup info
            - 📋 Read [CONTRIBUTING.md](https://github.com/RajwanYair/FamilyDashBoard/blob/main/.github/CONTRIBUTING.md) for guidelines
            - 🔐 For security issues, please use [private reporting](https://github.com/RajwanYair/FamilyDashBoard/security/advisories/new)
          pr-message: |
            👋 Welcome to FamilyDashBoard! Thanks for your first pull request.

            A maintainer will review your changes. Please ensure:
            - ✅ All CI checks pass
            - 📺 Tested on a large screen / TV mode
            - 🔄 RTL layout is intact
            - 🎨 Uses CSS variables (no hardcoded colors)

            See the [contribution guidelines](https://github.com/RajwanYair/FamilyDashBoard/blob/main/.github/CONTRIBUTING.md) for more details.
