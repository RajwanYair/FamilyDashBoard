name: Copilot Setup Steps
# Bootstrap environment for the GitHub Copilot Coding Agent.
# Reference: https://docs.github.com/en/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent
#
# This repository owns its development dependencies and committed lockfile, so
# the Coding Agent can bootstrap the exact same toolchain as local development.

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install repository-local toolchain
        run: bash .github/ci/install-tools.sh

      - name: Verify toolchain
        run: |
          node --version
          npm exec --no -- tsc --version
          npm exec --no -- vitest --version
          npm exec --no -- eslint --version
