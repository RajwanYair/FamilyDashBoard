  <text x="188" y="238" font-family="Segoe UI" font-size="8" fill="#94a3b8" text-anchor="middle">Hebrew Date + Shabbat</text>

  <rect x="250" y="200" width="116" height="48" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-opacity="0.15"/>
  <text x="308" y="220" font-family="Segoe UI" font-size="10" fill="#60a5fa" text-anchor="middle" font-weight="600">📈 Yahoo Finance</text>
  <text x="308" y="238" font-family="Segoe UI" font-size="8" fill="#94a3b8" text-anchor="middle">Stocks via CORS proxy</text>

