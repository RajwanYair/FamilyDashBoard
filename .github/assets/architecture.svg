  <rect x="490" y="200" width="116" height="48" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-opacity="0.15"/>
  <text x="548" y="220" font-family="Segoe UI" font-size="10" fill="#60a5fa" text-anchor="middle" font-weight="600">📅 Google Calendar</text>
  <text x="548" y="238" font-family="Segoe UI" font-size="8" fill="#94a3b8" text-anchor="middle">ICS parse + iframe</text>

  <rect x="610" y="200" width="116" height="48" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-opacity="0.15"/>
  <text x="668" y="220" font-family="Segoe UI" font-size="10" fill="#60a5fa" text-anchor="middle" font-weight="600">🚨 Red Alerts</text>
  <text x="668" y="238" font-family="Segoe UI" font-size="8" fill="#94a3b8" text-anchor="middle">tzevaadom.co.il</text>

  <rect x="730" y="200" width="60" height="48" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-opacity="0.15"/>
  <text x="760" y="220" font-family="Segoe UI" font-size="10" fill="#60a5fa" text-anchor="middle" font-weight="600">💱 ER-API</text>
  <text x="760" y="238" font-family="Segoe UI" font-size="8" fill="#94a3b8" text-anchor="middle">Currency</text>

  <!-- CORS proxy note -->
  <rect x="240" y="274" width="320" height="44" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.3"/>
  <text x="400" y="293" font-family="Segoe UI" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="600">🔄 CORS Proxy Fallback</text>
  <text x="400" y="308" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">direct → allorigins.win → codetabs.com → corsproxy.io</text>
