<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" rx="14" fill="url(#bg)"/>

  <text x="400" y="36" font-family="Segoe UI" font-size="20" font-weight="700" fill="#60a5fa" text-anchor="middle">Architecture</text>

  <!-- Browser box -->
  <rect x="240" y="56" width="320" height="50" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-opacity="0.25"/>
  <text x="400" y="78" font-family="Segoe UI" font-size="12" fill="#f1f5f9" text-anchor="middle" font-weight="600">🌐 BestDashBoard.html</text>
  <text x="400" y="96" font-family="Segoe UI" font-size="9" fill="#94a3b8" text-anchor="middle">HTML + CSS + JS  ·  Zero Dependencies</text>

  <!-- Arrow down -->
  <line x1="400" y1="106" x2="400" y2="130" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="394,128 406,128 400,136" fill="#60a5fa" opacity="0.5"/>

  <!-- fetch() box -->
  <rect x="330" y="136" width="140" height="30" rx="8" fill="#1e293b" stroke="#34d399" stroke-opacity="0.3"/>
  <text x="400" y="156" font-family="monospace" font-size="11" fill="#34d399" text-anchor="middle">fetch() + cache</text>

  <!-- Fan out arrows -->
  <line x1="300" y1="166" x2="68" y2="200" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="340" y1="166" x2="188" y2="200" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="370" y1="166" x2="308" y2="200" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="400" y1="166" x2="428" y2="200" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="430" y1="166" x2="548" y2="200" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="460" y1="166" x2="668" y2="200" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="470" y1="166" x2="752" y2="200" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.3"/>

