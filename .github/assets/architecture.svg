  <text x="68" y="238" font-family="Segoe UI" font-size="8" fill="#94a3b8" text-anchor="middle">Weather + UV + Hourly</text>

  <rect x="130" y="200" width="116" height="48" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-opacity="0.15"/>
