  </defs>
  <rect width="900" height="560" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="34" font-family="Segoe UI,system-ui" font-size="18" font-weight="700" fill="#60a5fa" text-anchor="middle">FamilyDashBoard — Architecture (v13.12.0)</text>

  <!-- ── BROWSER LAYER ── -->
  <rect x="30" y="54" width="840" height="68" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="450" y="78" font-family="Segoe UI" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">🌐  Browser (index.html + main.ts)</text>
  <text x="450" y="96" font-family="Segoe UI" font-size="10" fill="#94a3b8" text-anchor="middle">safeLoad() · Promise.allSettled · setInterval per card · cGet/cSet dual-layer cache · keyboard shortcuts</text>
  <text x="450" y="112" font-family="Segoe UI" font-size="9" fill="#64748b" text-anchor="middle">TypeScript 6.0.3 · Vite 8 build · ES Modules · 11 cards · 6 themes · RTL Hebrew</text>

  <!-- ── SERVICE WORKER ── -->
  <rect x="30" y="140" width="200" height="50" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.5"/>
  <text x="130" y="162" font-family="Segoe UI" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">⚙️  sw.ts (v13.12.0)</text>
  <text x="130" y="178" font-family="Segoe UI" font-size="9" fill="#94a3b8" text-anchor="middle">APP_SHELL · API cache · offline HTML</text>

