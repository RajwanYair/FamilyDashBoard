<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <rect width="900" height="460" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="450" y="32" font-family="Segoe UI,system-ui" font-size="17" font-weight="700" fill="#60a5fa" text-anchor="middle">Theme Cascade — FamilyDashBoard v8.4.0</text>
  <text x="450" y="50" font-family="Segoe UI,system-ui" font-size="10" fill="#64748b" text-anchor="middle">CSS custom property resolution order · 6 themes · @layer architecture</text>

  <!-- ── @layer stack (left column) ── -->
  <text x="30" y="80" font-family="Segoe UI" font-size="11" font-weight="700" fill="#94a3b8">@layer order</text>

  <!-- tokens -->
  <rect x="30" y="90" width="180" height="38" rx="7" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="120" y="108" font-family="Segoe UI" font-size="10" font-weight="700" fill="#a5b4fc" text-anchor="middle">tokens</text>
  <text x="120" y="122" font-family="Segoe UI" font-size="9" fill="#64748b" text-anchor="middle">tokens.css — design primitives</text>

  <!-- themes -->
  <rect x="30" y="140" width="180" height="38" rx="7" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="120" y="158" font-family="Segoe UI" font-size="10" font-weight="700" fill="#c4b5fd" text-anchor="middle">themes</text>
  <text x="120" y="172" font-family="Segoe UI" font-size="9" fill="#64748b" text-anchor="middle">themes.css — body.theme-* overrides</text>

  <!-- base -->
  <rect x="30" y="190" width="180" height="38" rx="7" fill="#0f2820" stroke="#34d399" stroke-width="1.5"/>
  <text x="120" y="208" font-family="Segoe UI" font-size="10" font-weight="700" fill="#6ee7b7" text-anchor="middle">base</text>
  <text x="120" y="222" font-family="Segoe UI" font-size="9" fill="#64748b" text-anchor="middle">base.css — reset, typography</text>

  <!-- layout -->
  <rect x="30" y="240" width="180" height="38" rx="7" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="258" font-family="Segoe UI" font-size="10" font-weight="700" fill="#93c5fd" text-anchor="middle">layout</text>
  <text x="120" y="272" font-family="Segoe UI" font-size="9" fill="#64748b" text-anchor="middle">layout.css — grid, header, status</text>

  <!-- components -->
  <rect x="30" y="290" width="180" height="38" rx="7" fill="#1e1b2e" stroke="#e879f9" stroke-width="1.5"/>
  <text x="120" y="308" font-family="Segoe UI" font-size="10" font-weight="700" fill="#f0abfc" text-anchor="middle">components</text>
  <text x="120" y="322" font-family="Segoe UI" font-size="9" fill="#64748b" text-anchor="middle">card, stale-chip, overlay…</text>

  <!-- animations -->
  <rect x="30" y="340" width="180" height="38" rx="7" fill="#1c1917" stroke="#fb923c" stroke-width="1.5"/>
  <text x="120" y="358" font-family="Segoe UI" font-size="10" font-weight="700" fill="#fdba74" text-anchor="middle">animations</text>
  <text x="120" y="372" font-family="Segoe UI" font-size="9" fill="#64748b" text-anchor="middle">keyframes, skeleton shimmer</text>

  <!-- ── 6 Themes (centre) ── -->
  <text x="450" y="80" font-family="Segoe UI" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">6 themes — body class</text>

  <!-- black -->
  <rect x="290" y="90" width="110" height="35" rx="7" fill="#000" stroke="#475569" stroke-width="1.5"/>
  <circle cx="305" cy="107" r="6" fill="#0f172a" stroke="#475569"/>
  <text x="405" y="112" font-family="Segoe UI" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="end">black (OLED)</text>

  <!-- blue -->
  <rect x="290" y="138" width="110" height="35" rx="7" fill="#0c1929" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="305" cy="155" r="6" fill="#1e40af" stroke="#3b82f6"/>
  <text x="405" y="160" font-family="Segoe UI" font-size="10" font-weight="600" fill="#93c5fd" text-anchor="end">blue</text>

  <!-- matrix -->
  <rect x="290" y="186" width="110" height="35" rx="7" fill="#001a00" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="305" cy="203" r="6" fill="#166534" stroke="#22c55e"/>
  <text x="405" y="208" font-family="Segoe UI" font-size="10" font-weight="600" fill="#86efac" text-anchor="end">matrix</text>

  <!-- amber -->
  <rect x="290" y="234" width="110" height="35" rx="7" fill="#1c1200" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="305" cy="251" r="6" fill="#92400e" stroke="#f59e0b"/>
  <text x="405" y="256" font-family="Segoe UI" font-size="10" font-weight="600" fill="#fcd34d" text-anchor="end">amber</text>

  <!-- purple -->
  <rect x="290" y="282" width="110" height="35" rx="7" fill="#130821" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="305" cy="299" r="6" fill="#6b21a8" stroke="#a855f7"/>
  <text x="405" y="304" font-family="Segoe UI" font-size="10" font-weight="600" fill="#d8b4fe" text-anchor="end">purple</text>

  <!-- rose -->
  <rect x="290" y="330" width="110" height="35" rx="7" fill="#1c0812" stroke="#f43f5e" stroke-width="1.5"/>
  <circle cx="305" cy="347" r="6" fill="#9f1239" stroke="#f43f5e"/>
  <text x="405" y="352" font-family="Segoe UI" font-size="10" font-weight="600" fill="#fda4af" text-anchor="end">rose</text>

  <!-- ── Custom property examples (right) ── -->
  <text x="720" y="80" font-family="Segoe UI" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Token overrides per theme</text>

  <!-- token block -->
  <rect x="580" y="90" width="290" height="265" rx="8" fill="#0d1117" stroke="#334155" stroke-width="1"/>
  <text x="596" y="112" font-family="Consolas,monospace" font-size="9" fill="#64748b">/* tokens.css (base) */</text>
  <text x="596" y="126" font-family="Consolas,monospace" font-size="9" fill="#818cf8">:root {</text>
  <text x="610" y="140" font-family="Consolas,monospace" font-size="9" fill="#94a3b8">--accent: <tspan fill="#60a5fa">#60a5fa</tspan>;</text>
  <text x="610" y="154" font-family="Consolas,monospace" font-size="9" fill="#94a3b8">--bg-card: <tspan fill="#60a5fa">rgba(30,41,59,.82)</tspan>;</text>
  <text x="610" y="168" font-family="Consolas,monospace" font-size="9" fill="#94a3b8">--positive: <tspan fill="#22c55e">#22c55e</tspan>;</text>
  <text x="596" y="182" font-family="Consolas,monospace" font-size="9" fill="#818cf8">}</text>

  <text x="596" y="202" font-family="Consolas,monospace" font-size="9" fill="#64748b">/* themes.css (overrides) */</text>
  <text x="596" y="216" font-family="Consolas,monospace" font-size="9" fill="#86efac">body.theme-matrix {</text>
  <text x="610" y="230" font-family="Consolas,monospace" font-size="9" fill="#94a3b8">--accent: <tspan fill="#22c55e">#22c55e</tspan>;</text>
  <text x="610" y="244" font-family="Consolas,monospace" font-size="9" fill="#94a3b8">--bg-card: <tspan fill="#22c55e">rgba(0,30,0,.88)</tspan>;</text>
  <text x="596" y="258" font-family="Consolas,monospace" font-size="9" fill="#86efac">}</text>

  <text x="596" y="278" font-family="Consolas,monospace" font-size="9" fill="#d8b4fe">body.theme-purple {</text>
  <text x="610" y="292" font-family="Consolas,monospace" font-size="9" fill="#94a3b8">--accent: <tspan fill="#a855f7">#a855f7</tspan>;</text>
  <text x="610" y="306" font-family="Consolas,monospace" font-size="9" fill="#94a3b8">--bg-card: <tspan fill="#a855f7">rgba(30,10,50,.88)</tspan>;</text>
  <text x="596" y="320" font-family="Consolas,monospace" font-size="9" fill="#d8b4fe">}</text>
  <text x="596" y="342" font-family="Consolas,monospace" font-size="9" fill="#64748b">/* cycled via T key — src/ui/theme.ts */</text>

  <!-- ── Theme switch flow ── -->
  <rect x="580" y="370" width="290" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="725" y="391" font-family="Segoe UI" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">Theme Switch Flow</text>
  <text x="725" y="407" font-family="Segoe UI" font-size="9" fill="#94a3b8" text-anchor="middle">T key → cycleTheme() → body.className → localStorage</text>
  <text x="725" y="418" font-family="Segoe UI" font-size="9" fill="#64748b" text-anchor="middle">dash_theme · auto-theme hook (AM/PM) in theme.ts</text>

  <!-- Connection arrows: themes → body.theme-* -->
  <line x1="400" y1="107" x2="578" y2="200" stroke="#475569" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <line x1="400" y1="155" x2="578" y2="215" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <line x1="400" y1="203" x2="578" y2="226" stroke="#22c55e" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#a)"/>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
