<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="bg"  x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#020810"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c1525"/>
    </linearGradient>
    <!-- Per-theme bg swatches -->
    <linearGradient id="th1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#000"/><stop offset="100%" stop-color="#1a1a1a"/></linearGradient>
    <linearGradient id="th2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0c1824"/><stop offset="100%" stop-color="#1a2e44"/></linearGradient>
    <linearGradient id="th3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0e1a10"/><stop offset="100%" stop-color="#1a2e1c"/></linearGradient>
    <linearGradient id="th4" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#18120a"/><stop offset="100%" stop-color="#2e1e0e"/></linearGradient>
    <linearGradient id="th5" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#140e1e"/><stop offset="100%" stop-color="#241830"/></linearGradient>
    <linearGradient id="th6" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#180a0e"/><stop offset="100%" stop-color="#2c101a"/></linearGradient>
    <linearGradient id="th7" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#000"/><stop offset="100%" stop-color="#111"/></linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="3" fill="url(#acc)" opacity="0.7"/>

  <!-- Title -->
  <text x="450" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#60a5fa" text-anchor="middle">FamilyDashBoard — CSS Theme System &amp; @layer Cascade</text>
  <text x="450" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">7 dark themes · CSS custom properties only · No hardcoded colors · View Transitions on switch · T key to cycle</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LEFT PANEL: @layer cascade                 x: 24→330 -->
  <!-- ══════════════════════════════════════════════════════ -->
  <rect x="24" y="64" width="304" height="320" rx="10" fill="#0c1525" stroke="#1e3a5f" stroke-width="1"/>
  <text x="176" y="86"  font-family="Segoe UI" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">CSS @layer Order</text>
  <text x="176" y="101" font-family="Segoe UI" font-size="9"  fill="#475569"  text-anchor="middle">Later layers win on specificity tie</text>

  <!-- Layer 1: tokens -->
  <rect x="44" y="110" width="264" height="34" rx="7" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="60"  y="124" font-family="ui-monospace,Consolas,monospace" font-size="9.5" fill="#93c5fd">@layer tokens</text>
  <text x="60"  y="138" font-family="Segoe UI" font-size="8" fill="#475569">Base design tokens — --accent, --bg-card, --positive …</text>
  <!-- Layer 2: themes — highlighted override -->
  <rect x="44" y="152" width="264" height="34" rx="7" fill="#1e3f1e" stroke="#34d399" stroke-width="1.8"/>
  <text x="60"  y="166" font-family="ui-monospace,Consolas,monospace" font-size="9.5" fill="#6ee7b7">@layer themes  ← body.theme-* override</text>
  <text x="60"  y="180" font-family="Segoe UI" font-size="8" fill="#475569">Rewrites tokens per selected theme</text>
  <!-- Layer 3: base -->
  <rect x="44" y="194" width="264" height="34" rx="7" fill="url(#tile)" stroke="#475569" stroke-width="1"/>
  <text x="60"  y="208" font-family="ui-monospace,Consolas,monospace" font-size="9.5" fill="#94a3b8">@layer base</text>
  <text x="60"  y="222" font-family="Segoe UI" font-size="8" fill="#475569">Reset · body · typography · scrollbar</text>
  <!-- Layer 4: layout -->
  <rect x="44" y="236" width="264" height="34" rx="7" fill="url(#tile)" stroke="#475569" stroke-width="1"/>
  <text x="60"  y="250" font-family="ui-monospace,Consolas,monospace" font-size="9.5" fill="#94a3b8">@layer layout</text>
  <text x="60"  y="264" font-family="Segoe UI" font-size="8" fill="#475569">3-col grid · @container queries · drag-drop</text>
  <!-- Layer 5: components -->
  <rect x="44" y="278" width="264" height="34" rx="7" fill="url(#tile)" stroke="#475569" stroke-width="1"/>
  <text x="60"  y="292" font-family="ui-monospace,Consolas,monospace" font-size="9.5" fill="#94a3b8">@layer components</text>
  <text x="60"  y="306" font-family="Segoe UI" font-size="8" fill="#475569">Cards · headers · badges · dialogs · overlays</text>
  <!-- Layer 6: animations -->
  <rect x="44" y="320" width="264" height="34" rx="7" fill="url(#tile)" stroke="#475569" stroke-width="1"/>
  <text x="60"  y="334" font-family="ui-monospace,Consolas,monospace" font-size="9.5" fill="#94a3b8">@layer animations</text>
  <text x="60"  y="348" font-family="Segoe UI" font-size="8" fill="#475569">@keyframes · transitions · entrance effects</text>

  <!-- specificity arrow -->
  <line x1="176" y1="356" x2="176" y2="374" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="176" y="389" font-family="Segoe UI" font-size="8.5" fill="#334155" text-anchor="middle">higher specificity wins</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- RIGHT PANEL: 7 theme swatches              x: 346→876 -->
  <!-- ══════════════════════════════════════════════════════ -->
  <rect x="346" y="64" width="530" height="320" rx="10" fill="#0c1525" stroke="#1e3a5f" stroke-width="1"/>
  <text x="611" y="86"  font-family="Segoe UI" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">7 Dark Themes</text>
  <text x="611" y="101" font-family="Segoe UI" font-size="9"  fill="#475569"  text-anchor="middle">bg swatch · accent swatch · name · CSS class · --accent value</text>

  <!-- Each row: bg rect 530px wide, bg swatch 22px, accent swatch 22px, labels -->
  <!-- y: 110, 152, 194, 236, 278, 320, 362  (42px pitch) -->

  <!-- 1: True Black (OLED) -->
  <rect x="366" y="110" width="490" height="34" rx="6" fill="url(#th1)" stroke="#c8a87a" stroke-width="0.8" stroke-opacity="0.45"/>
  <rect x="376" y="116" width="22" height="22" rx="4" fill="#000"    stroke="#c8a87a" stroke-width="0.6"/>
  <rect x="403" y="116" width="22" height="22" rx="4" fill="#c8a87a"/>
  <text x="435" y="130" font-family="Segoe UI" font-size="10" font-weight="700" fill="#c8a87a">True Black (OLED)</text>
  <text x="435" y="141" font-family="ui-monospace,Consolas,monospace" font-size="7.5" fill="#475569">theme-black</text>
  <text x="848" y="130" font-family="ui-monospace,Consolas,monospace" font-size="8" fill="#c8a87a" text-anchor="end">--accent: #c8a87a</text>

  <!-- 2: Ocean Blue (default) -->
  <rect x="366" y="152" width="490" height="34" rx="6" fill="url(#th2)" stroke="#82b8d8" stroke-width="0.8" stroke-opacity="0.45"/>
  <rect x="376" y="158" width="22" height="22" rx="4" fill="#0c1824" stroke="#82b8d8" stroke-width="0.6"/>
  <rect x="403" y="158" width="22" height="22" rx="4" fill="#82b8d8"/>
  <text x="435" y="172" font-family="Segoe UI" font-size="10" font-weight="700" fill="#82b8d8">Ocean Blue</text>
  <text x="435" y="183" font-family="ui-monospace,Consolas,monospace" font-size="7.5" fill="#475569">theme-blue  (default)</text>
  <text x="848" y="172" font-family="ui-monospace,Consolas,monospace" font-size="8" fill="#82b8d8" text-anchor="end">--accent: #82b8d8</text>

  <!-- 3: Forest Green -->
  <rect x="366" y="194" width="490" height="34" rx="6" fill="url(#th3)" stroke="#86c490" stroke-width="0.8" stroke-opacity="0.45"/>
  <rect x="376" y="200" width="22" height="22" rx="4" fill="#0e1a10" stroke="#86c490" stroke-width="0.6"/>
  <rect x="403" y="200" width="22" height="22" rx="4" fill="#86c490"/>
  <text x="435" y="214" font-family="Segoe UI" font-size="10" font-weight="700" fill="#86c490">Forest Green</text>
  <text x="435" y="225" font-family="ui-monospace,Consolas,monospace" font-size="7.5" fill="#475569">theme-matrix</text>
  <text x="848" y="214" font-family="ui-monospace,Consolas,monospace" font-size="8" fill="#86c490" text-anchor="end">--accent: #86c490</text>

  <!-- 4: Amber Glow -->
  <rect x="366" y="236" width="490" height="34" rx="6" fill="url(#th4)" stroke="#c8a07c" stroke-width="0.8" stroke-opacity="0.45"/>
  <rect x="376" y="242" width="22" height="22" rx="4" fill="#18120a" stroke="#c8a07c" stroke-width="0.6"/>
  <rect x="403" y="242" width="22" height="22" rx="4" fill="#c8a07c"/>
  <text x="435" y="256" font-family="Segoe UI" font-size="10" font-weight="700" fill="#c8a07c">Amber Glow</text>
  <text x="435" y="267" font-family="ui-monospace,Consolas,monospace" font-size="7.5" fill="#475569">theme-amber</text>
  <text x="848" y="256" font-family="ui-monospace,Consolas,monospace" font-size="8" fill="#c8a07c" text-anchor="end">--accent: #c8a07c</text>

  <!-- 5: Purple Dusk -->
  <rect x="366" y="278" width="490" height="34" rx="6" fill="url(#th5)" stroke="#b8aad4" stroke-width="0.8" stroke-opacity="0.45"/>
  <rect x="376" y="284" width="22" height="22" rx="4" fill="#140e1e" stroke="#b8aad4" stroke-width="0.6"/>
  <rect x="403" y="284" width="22" height="22" rx="4" fill="#b8aad4"/>
  <text x="435" y="298" font-family="Segoe UI" font-size="10" font-weight="700" fill="#b8aad4">Purple Dusk</text>
  <text x="435" y="309" font-family="ui-monospace,Consolas,monospace" font-size="7.5" fill="#475569">theme-purple</text>
  <text x="848" y="298" font-family="ui-monospace,Consolas,monospace" font-size="8" fill="#b8aad4" text-anchor="end">--accent: #b8aad4</text>

  <!-- 6: Rose Night -->
  <rect x="366" y="320" width="490" height="34" rx="6" fill="url(#th6)" stroke="#c08898" stroke-width="0.8" stroke-opacity="0.45"/>
  <rect x="376" y="326" width="22" height="22" rx="4" fill="#180a0e" stroke="#c08898" stroke-width="0.6"/>
  <rect x="403" y="326" width="22" height="22" rx="4" fill="#c08898"/>
  <text x="435" y="340" font-family="Segoe UI" font-size="10" font-weight="700" fill="#c08898">Rose Night</text>
  <text x="435" y="351" font-family="ui-monospace,Consolas,monospace" font-size="7.5" fill="#475569">theme-rose</text>
  <text x="848" y="340" font-family="ui-monospace,Consolas,monospace" font-size="8" fill="#c08898" text-anchor="end">--accent: #c08898</text>

  <!-- 7: High Contrast (WCAG AAA) -->
  <rect x="366" y="362" width="490" height="34" rx="6" fill="url(#th7)" stroke="#ffdd00" stroke-width="1.2" stroke-opacity="0.7"/>
  <rect x="376" y="368" width="22" height="22" rx="4" fill="#000"    stroke="#ffdd00" stroke-width="1"/>
  <rect x="403" y="368" width="22" height="22" rx="4" fill="#ffdd00"/>
  <text x="435" y="382" font-family="Segoe UI" font-size="10" font-weight="700" fill="#ffdd00">High Contrast</text>
  <text x="435" y="393" font-family="ui-monospace,Consolas,monospace" font-size="7.5" fill="#475569">theme-high-contrast  (WCAG AAA)</text>
  <text x="848" y="382" font-family="ui-monospace,Consolas,monospace" font-size="8" fill="#ffdd00" text-anchor="end">--accent: #ffdd00</text>

  <!-- Bottom accent strip -->
  <rect x="0" y="397" width="900" height="3" fill="url(#acc)" opacity="0.35"/>
</svg>
