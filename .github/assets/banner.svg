<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060b14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="900" height="200" rx="16" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="80" cy="100" r="60" fill="#60a5fa" opacity="0.06"/>
  <circle cx="820" cy="100" r="60" fill="#34d399" opacity="0.06"/>
  <circle cx="450" cy="180" r="120" fill="#8b5cf6" opacity="0.04"/>
  <!-- Accent line -->
  <line x1="140" y1="150" x2="760" y2="150" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <!-- Emoji row -->
  <text x="200" y="100" font-size="32" text-anchor="middle">📰</text>
  <text x="300" y="100" font-size="32" text-anchor="middle">📅</text>
  <text x="400" y="100" font-size="32" text-anchor="middle">📈</text>
  <text x="500" y="100" font-size="32" text-anchor="middle">🌤️</text>
  <text x="600" y="100" font-size="32" text-anchor="middle">💱</text>
  <text x="700" y="100" font-size="32" text-anchor="middle">💪</text>
  <!-- Title -->
  <text x="450" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" fill="url(#accent)" text-anchor="middle" letter-spacing="2">Family Dashboard</text>
  <!-- Subtitle -->
  <text x="450" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Single-file TV dashboard · Hebrew RTL · Dark Glassmorphism · Zero Dependencies</text>
  <text x="450" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle" opacity="0.7">v14.8.0 · TypeScript modular · 7067 Vitest tests · 279 suites · 0 failures · 6 themes</text>
</svg>
