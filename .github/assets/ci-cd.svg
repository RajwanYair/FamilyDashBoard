<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
  <rect width="900" height="340" rx="12" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="30" fill="#94a3b8" font-size="14" text-anchor="middle" font-weight="bold">FamilyDashBoard — CI/CD Pipeline</text>

  <!-- Stage boxes: y=60 for top row, y=200 for bottom -->
  <!-- typecheck -->
  <rect x="20" y="70" width="110" height="56" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="75" y="97" fill="#a5b4fc" text-anchor="middle" font-weight="bold">typecheck</text>
  <text x="75" y="114" fill="#64748b" text-anchor="middle" font-size="11">tsc --noEmit</text>

  <!-- lint -->
  <rect x="160" y="70" width="110" height="56" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="215" y="97" fill="#a5b4fc" text-anchor="middle" font-weight="bold">lint</text>
  <text x="215" y="114" fill="#64748b" text-anchor="middle" font-size="11">eslint 0 warnings</text>

  <!-- tests (3 node versions) -->
  <rect x="300" y="55" width="140" height="86" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="370" y="82" fill="#a5b4fc" text-anchor="middle" font-weight="bold">unit-tests</text>
  <text x="370" y="99" fill="#64748b" text-anchor="middle" font-size="11">Node 20 / 22 / 24</text>
  <text x="370" y="116" fill="#64748b" text-anchor="middle" font-size="11">3193 tests · 94 suites</text>
  <text x="370" y="133" fill="#64748b" text-anchor="middle" font-size="11">vitest run</text>

  <!-- security -->
  <rect x="470" y="70" width="110" height="56" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="525" y="97" fill="#fcd34d" text-anchor="middle" font-weight="bold">security</text>
  <text x="525" y="114" fill="#64748b" text-anchor="middle" font-size="11">npm audit high+</text>

  <!-- worker-tests -->
  <rect x="610" y="70" width="120" height="56" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="670" y="97" fill="#a5b4fc" text-anchor="middle" font-weight="bold">worker-tests</text>
  <text x="670" y="114" fill="#64748b" text-anchor="middle" font-size="11">Cloudflare Worker</text>

  <!-- build -->
  <rect x="200" y="195" width="120" height="56" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="260" y="222" fill="#6ee7b7" text-anchor="middle" font-weight="bold">build</text>
  <text x="260" y="239" fill="#64748b" text-anchor="middle" font-size="11">vite build (IIFE)</text>

  <!-- sw-version-check -->
  <rect x="350" y="195" width="150" height="56" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="425" y="219" fill="#6ee7b7" text-anchor="middle" font-weight="bold">sw-version</text>
  <text x="425" y="236" fill="#64748b" text-anchor="middle" font-size="11">check-sw-version.mjs</text>
  <text x="425" y="250" fill="#64748b" text-anchor="middle" font-size="11">bundle-size check</text>

  <!-- release (conditional) -->
  <rect x="580" y="195" width="130" height="56" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="645" y="219" fill="#c4b5fd" text-anchor="middle" font-weight="bold">release</text>
  <text x="645" y="236" fill="#64748b" text-anchor="middle" font-size="11">on tag v*.*.* push</text>
  <text x="645" y="250" fill="#64748b" text-anchor="middle" font-size="11">gh release create</text>

  <!-- Arrows: typecheck → lint -->
  <line x1="130" y1="98" x2="158" y2="98" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- lint → tests -->
  <line x1="270" y1="98" x2="298" y2="98" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- tests → security -->
  <line x1="440" y1="98" x2="468" y2="98" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- security → worker-tests -->
  <line x1="580" y1="98" x2="608" y2="98" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- tests → build (down arrow) -->
  <line x1="370" y1="141" x2="370" y2="165" stroke="#475569" stroke-width="1.5"/>
  <line x1="370" y1="165" x2="260" y2="165" stroke="#475569" stroke-width="1.5"/>
  <line x1="260" y1="165" x2="260" y2="193" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- build → sw-version -->
  <line x1="320" y1="223" x2="348" y2="223" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- sw-version → release -->
  <line x1="500" y1="223" x2="578" y2="223" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-dashed)"/>

  <!-- Legend -->
  <text x="20" y="298" fill="#475569" font-size="11">──  always runs</text>
  <text x="130" y="298" fill="#475569" font-size="11">- -  on tag push only</text>
  <rect x="20" y="308" width="12" height="12" rx="3" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="36" y="318" fill="#64748b" font-size="11">test / quality</text>
  <rect x="130" y="308" width="12" height="12" rx="3" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="146" y="318" fill="#64748b" font-size="11">build</text>
  <rect x="220" y="308" width="12" height="12" rx="3" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="236" y="318" fill="#64748b" font-size="11">release (conditional)</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arr-dashed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
