name = "familydashboard-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Smart Placement: CF picks the PoP nearest to origin APIs, not the client.
# Improves latency for origin-fetch routes (stocks, weather, currency, news).
# ADR-031 vendor-neutrality drill: enabled unconditionally — no opt-in.
[placement]
mode = "smart"

[vars]
ENVIRONMENT = "production"

# Cache API responses at the edge
[cache]
default_ttl = 300  # 5 minutes

# KV namespace for stale-fallback cache (Stream W.2)
# Create via: wrangler kv:namespace create CACHE_KV
[[kv_namespaces]]
binding = "CACHE_KV"
id = "PLACEHOLDER_KV_ID"
preview_id = "PLACEHOLDER_KV_PREVIEW_ID"

# D1 database for telemetry/error persistence (V12-EDGE-2)
# Provision via: wrangler d1 create fdb-telemetry
[[d1_databases]]
binding = "DB"
database_name = "fdb-telemetry"
database_id = "PLACEHOLDER_D1_ID"

# Durable Object for alerts SSE fan-out (V12-EDGE-3, SSE live in V13-EDGE-1)
# Regional jurisdiction pinned to "eu" — Cloudflare routes IL traffic to EU PoPs (V13-EDGE-2)
# See ADR-025 for the full SSE design and migration path.
[[durable_objects.bindings]]
name = "ALERTS_DO"
class_name = "AlertsOrchestrator"
jurisdiction = "eu"

[[migrations]]
tag = "v1"
new_classes = ["AlertsOrchestrator"]

# Cron triggers: daily pre-warm of hot API paths (V12-OPS-1)
# 00:00 UTC — warm stocks, currency, hebcal before the working day
# 12:00 UTC — mid-day warm to refresh stale KV entries
# 23:00 UTC — pre-warm next Hebrew year holidays on 29 Elul (V12-DATA)
#              also prunes browser_reports older than 30 days (V12-OPS, ADR-028)
# 23:00 UTC Saturday (dow=6) — weekly digest email (ADR-033, V13-S27)
[triggers]
crons = ["0 0 * * *", "0 12 * * *", "0 23 * * *", "0 23 * * 6"]

# Worker secrets (set via `wrangler secret put <NAME>`):
#   ERROR_REPORTING_TOKEN  — GET /api/errors/export gate
#   FINNHUB_API_KEY        — Finnhub stock price backup
#   METRICS_TOKEN          — GET /api/metrics Prometheus endpoint gate
#   REPORTS_TOKEN          — GET /api/reports/digest gate (V12-OPS, ADR-028)
#   EMAIL_SEND_FROM        — sender address for weekly digest (ADR-033)
#   EMAIL_SEND_TO          — recipient address for weekly digest (ADR-033)
#
# Worker environment variables (set via `wrangler deploy --var`):
#   CANARY_PCT             — 0–100 integer string for canary traffic tagging (V12-EDGE-4b)
#                            e.g. "10" tags 10% of responses with X-Canary: true
#
# Analytics Engine dataset (V12-EDGE-2b, ADR-029):
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "fdb_requests"

# Workers Queue for error fan-out (ADR-032, V13-S26)
# Create via: wrangler queues create fdb-errors
# Producer binding — used in handleErrors() when ERRORS_QUEUE is bound.
[[queues.producers]]
binding = "ERRORS_QUEUE"
queue = "fdb-errors"

# Consumer binding — routes dequeued messages to the queue() handler.
[[queues.consumers]]
queue = "fdb-errors"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "fdb-errors-dlq"
