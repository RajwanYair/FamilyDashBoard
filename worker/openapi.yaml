openapi: "3.1.0"
info:
  title: FamilyDashBoard API Proxy
  description: |
    Cloudflare Worker API proxy for the FamilyDashBoard dashboard.
    All routes enforce CORS (any origin), per-IP rate limiting (120 req/min),
    and SSRF allowlists on URL parameters.
  version: "13.1.0"
  contact:
    name: FamilyDashBoard
    url: https://github.com/RajwanYair/FamilyDashBoard
  x-ttl-audit:
    last-audit: "2026-04-29"
    auditor: "Sprint 155 / v13.17.0"
    verdict: >
      All 22 routes reviewed — all x-kv-ttl values are appropriate for their
      data volatility and upstream rate-limit budgets. No TTL changes required.
      Weather (1800s) and alerts (60s) remain the highest-churn routes; crypto and
      stocks (300s) are correctly aligned with market-open polling cadence. Static
      content (Sefaria text, motivation) correctly at 86400s.
    routes-audited: 22
    next-audit: "2027-Q1 (with v14.0)"

servers:
  - url: https://fdb.rajwanyair.workers.dev
    description: Production Cloudflare Worker

tags:
  - name: health
    description: Worker health check and error telemetry
  - name: weather
    description: Weather data from Open-Meteo
  - name: finance
    description: Currency and stock data
  - name: calendar
    description: Hebrew and Gregorian calendar data
  - name: news
    description: RSS news feed proxy
  - name: alerts
    description: Israeli civil-defense alerts (Tzeva Adom)
  - name: crypto
    description: Cryptocurrency price data from CoinGecko
  - name: sefaria
    description: Jewish text data from Sefaria.org

paths:
  /health:
    get:
      tags: [health]
      summary: Worker health check
      x-kv-ttl: 0
      operationId: getHealth
      responses:
        "200":
          description: Worker is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: healthy
                  ts:
                    type: integer
                    description: Server timestamp (Unix ms)
                    example: 1714000000000

  /api/weather:
    get:
      tags: [weather]
      summary: Current + hourly + daily weather forecast
      description: Proxies Open-Meteo for a given location. Cached 30 min.
      x-kv-ttl: 1800
      operationId: getWeather
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
          example: 32.08
        - name: lon
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
          example: 34.78
      responses:
        "200":
          description: Open-Meteo forecast JSON (proxied verbatim)
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/currency:
    get:
      tags: [finance]
      summary: Exchange rates (ILS base)
      description: |
        Tiered upstreams: open.er-api.com → exchangerate-api.com → ECB via
        Frankfurter (api.frankfurter.dev). KV stale fallback if all fail.
        Cached 1 h.
      x-kv-ttl: 3600
      x-kv-stale-ttl: 172800
      operationId: getCurrency
      responses:
        "200":
          description: Exchange-rate JSON (proxied verbatim)
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/stocks:
    get:
      tags: [finance]
      summary: Stock quote for a single ticker
      description: |
        Proxies Yahoo Finance v8 chart endpoint. Cached 5 min.
        On upstream failure, returns last KV-cached value with `stale: true`
        (KV TTL: 24 h, provider: `yahoo-kv-stale`). See ADR-013.
      x-kv-ttl: 300
      x-kv-stale-ttl: 86400
      operationId: getStock
      parameters:
        - name: sym
          in: query
          required: true
          schema:
            type: string
            pattern: "^[\\w.\\-^]{1,20}$"
          example: AAPL
      responses:
        "200":
          description: Yahoo Finance v8 chart response (validated + re-serialized)
        "400":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: Upstream error or schema validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/hebcal:
    get:
      tags: [calendar]
      summary: Shabbat times for a given location (Hebcal)
      description: Proxies Hebcal shabbat endpoint. Cached 6 h.
      x-kv-ttl: 21600
      operationId: getHebcal
      parameters:
        - name: geonameid
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{1,10}$"
            default: "281184"
          description: Geonames ID for the city (default = Tel Aviv)
          example: "281184"
      responses:
        "200":
          description: Hebcal shabbat JSON (proxied verbatim)
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/hebcal/holidays:
    get:
      tags: [calendar]
      summary: Jewish holidays list for a Gregorian year
      description: Proxies Hebcal holiday list. Cached 12 h.
      x-kv-ttl: 43200
      operationId: getHebcalHolidays
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
          description: Gregorian year (defaults to current year)
          example: 2026
      responses:
        "200":
          description: Hebcal holiday JSON (proxied verbatim)
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/calendar:
    get:
      tags: [calendar]
      summary: Google Calendar ICS proxy
      description: |
        Fetches an ICS calendar file from an allowlisted origin.
        Validates that the response contains a valid VCALENDAR.
        Cached 15 min.
      x-kv-ttl: 900
      operationId: getCalendar
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: HTTPS ICS URL from an allowlisted origin (google, outlook, apple)
      responses:
        "200":
          description: ICS calendar text
          content:
            text/calendar:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          description: Calendar origin not in allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream calendar server error
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/news:
    get:
      tags: [news]
      summary: RSS news feed proxy (single feed)
      description: |
        Fetches an RSS/Atom feed from an allowlisted news origin.
        Validates that the response is a valid RSS 2.0 or Atom 1.0 feed.
        Returns the raw XML. Cached 15 min.
      x-kv-ttl: 900
      operationId: getNews
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: HTTPS RSS URL from an allowlisted news domain
      responses:
        "200":
          description: Raw RSS/Atom XML
          content:
            application/rss+xml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          description: News origin not in allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/news/aggregate:
    get:
      tags: [news]
      summary: Aggregated news feed (all curated RSS sources)
      description: |
        Fetches all 17 curated RSS/Atom feeds in parallel, deduplicates by title,
        sorts newest-first, and returns up to 100 normalised items as JSON.
        Results are cached in KV for 15 min (TTL 900 s).
        On total failure, returns last KV-cached value with `stale: true`.
        See ADR-007 for the news aggregation strategy.
      x-kv-ttl: 900
      operationId: getNewsAggregate
      responses:
        "200":
          description: |
            WorkerEnvelope wrapping an array of normalised news items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WorkerEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        maxItems: 100
                        items:
                          $ref: "#/components/schemas/NewsItem"
        "502":
          description: All news feed upstreams failed and no KV stale available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/news/summarise:
    get:
      tags: [news]
      summary: Workers AI Hebrew news summarisation (AI_ENABLED=true)
      description: |
        Returns a Hebrew summary of today's top news using Workers AI.
        Only active when the `AI_ENABLED` environment variable is set to `"true"`.
        Returns 503 `{"ok":false,"error":"ai_disabled"}` when AI is not enabled.
        Returns 501 `{"ok":false,"error":"ai_not_implemented"}` when AI is enabled
        but the implementation is not yet deployed (ADR-030).
      x-kv-ttl: 900
      operationId: getNewsSummarise
      responses:
        "200":
          description: AI-generated Hebrew news summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  summary:
                    type: string
                    description: Hebrew-language news summary
        "501":
          description: AI enabled but implementation pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: AI_ENABLED not set — feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/alerts:
    get:
      tags: [alerts]
      summary: Tzeva Adom (Red Alert) history
      description: |
        Proxies api.tzevaadom.co.il. Cached 1 min.
        On upstream failure, returns last KV-cached value with `stale: true`
        (KV TTL: 1 h, provider: `tzevaadom-kv-stale`). See ADR-013.
      x-kv-ttl: 60
      x-kv-stale-ttl: 3600
      operationId: getAlerts
      responses:
        "200":
          description: Alert history JSON (proxied verbatim)
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/sefaria/calendar:
    get:
      tags: [sefaria]
      summary: Sefaria daily calendar (Daf Yomi, Parashat Hashavua, etc.)
      description: Proxies Sefaria /api/calendars. Cached 24 h.
      x-kv-ttl: 86400
      operationId: getSefariaCalendar
      responses:
        "200":
          description: Sefaria calendars JSON (proxied verbatim)
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/sefaria/text:
    get:
      tags: [sefaria]
      summary: Individual Sefaria text lookup
      description: |
        Fetches a single Sefaria text by reference (e.g. Berakhot.2a.1).
        Cached 24 h (text content is stable).
      x-kv-ttl: 86400
      operationId: getSefariaText
      parameters:
        - name: ref
          in: query
          required: true
          schema:
            type: string
            maxLength: 120
          description: Sefaria text reference
          example: "Berakhot.2a.1"
      responses:
        "200":
          description: Sefaria text JSON (proxied verbatim)
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/crypto:
    get:
      tags: [crypto]
      summary: CoinGecko Bitcoin price (validated proxy)
      description: |
        Proxies the CoinGecko simple/price endpoint for Bitcoin USD.
        Validates response schema and returns 502 on mismatch.
        On upstream failure, returns last KV-cached value with `stale: true`
        (KV TTL: 24 h, provider: `coingecko-kv-stale`). See ADR-013.
      x-kv-ttl: 300
      x-kv-stale-ttl: 86400
      operationId: getCrypto
      parameters:
        - name: ids
          in: query
          required: false
          schema:
            type: string
            enum: [bitcoin]
            default: bitcoin
          description: Coin identifier (only bitcoin supported)
        - name: vs_currencies
          in: query
          required: false
          schema:
            type: string
            default: usd
          description: Target currency (usd)
      responses:
        "200":
          description: CoinGecko bitcoin price (validated + re-serialized)
          content:
            application/json:
              schema:
                type: object
                properties:
                  bitcoin:
                    type: object
                    properties:
                      usd:
                        type: number
                        example: 65000
                      usd_24h_change:
                        type: number
                        example: 2.3
        "400":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: Upstream error or schema validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/motivation/hebrew:
    get:
      tags: [news]
      summary: Workers AI Hebrew motivational quote (AI_ENABLED=true)
      description: |
        Returns a Hebrew motivational quote using Workers AI.
        Only active when the `AI_ENABLED` environment variable is set to `"true"`.
        Returns 503 `{"ok":false,"error":"ai_disabled"}` when AI is not enabled.
        Returns 501 `{"ok":false,"error":"ai_not_implemented"}` when AI is enabled
        but the implementation is not yet deployed (ADR-030).
      x-kv-ttl: 86400
      operationId: getMotivationHebrew
      responses:
        "200":
          description: AI-generated Hebrew motivational quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  quote:
                    type: string
                    description: Hebrew-language motivational quote
                  author:
                    type: string
                    description: Attribution (optional)
        "501":
          description: AI enabled but implementation pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: AI_ENABLED not set — feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/errors:
    post:
      tags: [health]
      summary: Client error ingestion (persisted telemetry)
      description: |
        Accepts an array of client-side error entries from the dashboard.
        Entries are logged to Worker console (CF Logpush / live tail) **and**
        persisted to Cloudflare KV with a 7-day TTL.
        KV key format: `errors:YYYY-MM-DD:<8-char-hex-id>`.
        Daily cap: 1 000 entries/day (counter key: `errors:count:YYYY-MM-DD`).
        Entries beyond the cap are logged but not stored.
        Rate-limited by shared middleware.
      operationId: postErrors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 20
              items:
                type: object
                required: [ts, message]
                properties:
                  ts:
                    type: integer
                    description: Unix timestamp (ms)
                    example: 1714000000000
                  message:
                    type: string
                    maxLength: 500
                    example: "TypeError: Cannot read properties of null"
                  source:
                    type: string
                    example: "src/cards/weather/weather.ts"
                  lineno:
                    type: integer
                    example: 42
      responses:
        "204":
          description: Errors accepted (no content)
        "400":
          $ref: "#/components/responses/ValidationError"
        "405":
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Too many error entries (max 20)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/errors/export:
    get:
      tags: [health]
      summary: Export today's stored error entries (token-gated)
      x-kv-ttl: 0
      description: |
        Returns all error entries persisted to KV today (UTC), newest-first.
        Requires the `ERROR_REPORTING_TOKEN` worker secret via `?token=`.
        If the secret is not configured, returns `501 Not Implemented`.
        Entries are returned for the current UTC date.
      operationId: getErrorsExport
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Matches the `ERROR_REPORTING_TOKEN` worker secret
      responses:
        "200":
          description: Array of error entries for today, newest-first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [ts, message]
                  properties:
                    ts:
                      type: integer
                      description: Unix timestamp (ms)
                      example: 1714000000000
                    message:
                      type: string
                      example: "TypeError: Cannot read properties of null"
                    source:
                      type: string
                      example: "src/cards/weather/weather.ts"
                    lineno:
                      type: integer
                      example: 42
        "401":
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: ERROR_REPORTING_TOKEN not configured on the worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/metrics:
    get:
      tags: [health]
      summary: Prometheus-format route hit metrics (token-gated)
      x-kv-ttl: 0
      description: |
        Returns Prometheus text-format counters for D1-backed route hit telemetry.
        Requires the `METRICS_TOKEN` worker secret via `?token=`.
        If `METRICS_TOKEN` is not configured, returns `501 Not Implemented`.
        Data covers the last 7 days of hits, grouped by route.
      operationId: getMetrics
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Matches the `METRICS_TOKEN` worker secret
      responses:
        "200":
          description: Prometheus text format metrics
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP fdb_route_hits_total Route hit counter
                  # TYPE fdb_route_hits_total counter
                  fdb_route_hits_total{route="/api/weather"} 42
        "401":
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: METRICS_TOKEN or D1 DB not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/reports:
    post:
      tags: [health]
      summary: Browser Reporting API ingest (CSP + deprecation + intervention)
      description: |
        Receives browser-generated reports forwarded by the W3C Reporting API
        (https://www.w3.org/TR/reporting-1/). Browsers that have
        `Report-To` or `Reporting-Endpoints` header configured will POST
        arrays of CSP violation, deprecation-warning, and intervention reports
        here automatically.

        No authentication is required for POST (browsers send these natively).
        Reports are stored in D1 (max 50 per request, 30-day retention).
        If D1 is not configured, reports are silently dropped with a 204 response.
        Never stores IP addresses, User-Agent strings, or any PII.

        See ADR-028.
      operationId: postReports
      requestBody:
        required: true
        content:
          application/reports+json:
            schema:
              type: array
              maxItems: 50
              items:
                $ref: "#/components/schemas/BrowserReport"
          application/json:
            schema:
              type: array
              maxItems: 50
              items:
                $ref: "#/components/schemas/BrowserReport"
      responses:
        "204":
          description: Reports accepted (or silently dropped when DB not configured)
        "400":
          description: Invalid JSON or body is not an array
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/alerts/subscribe:
    get:
      tags: [alerts]
      summary: Server-Sent Events stream for real-time alert push (DO-backed)
      x-kv-ttl: 0
      description: |
        Opens a persistent SSE connection backed by the AlertsOrchestrator
        Durable Object. The client receives `event: ping` on connect and
        `event: alert` on each new Tzeva Adom broadcast. Falls back to polling
        if ALERTS_DO binding is not present. Not cached (x-kv-ttl: 0).
        Requires ALERTS_DO binding. See ADR-025.
      operationId: getAlertsSubscribe
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Newline-separated SSE events. Known event types:
                  `ping` (on connect), `alert` (on new Tzeva Adom broadcast).
        "503":
          description: ALERTS_DO not bound or DO unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/canary:
    get:
      tags: [health]
      summary: Canary traffic tagging status
      x-kv-ttl: 0
      description: |
        Returns whether the current request was tagged as canary traffic
        and the configured canary percentage. Controlled by the `CANARY_PCT`
        environment variable (0–100). Useful for validating canary routing
        after a new Worker deployment. Not cached (x-kv-ttl: 0).
      operationId: getCanary
      responses:
        "200":
          description: Canary status object
          content:
            application/json:
              schema:
                type: object
                required: [canary, pct, ts]
                properties:
                  canary:
                    type: boolean
                    description: Whether this request is tagged as canary traffic
                    example: false
                  pct:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: Configured canary percentage (CANARY_PCT)
                    example: 10
                  ts:
                    type: integer
                    description: Unix timestamp in milliseconds
                    example: 1750000000000
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/reports/digest:
    get:
      tags: [health]
      summary: Report count digest (token-gated, last 30 days)
      x-kv-ttl: 0
      description: |
        Returns a JSON summary of stored browser reports grouped by type and UTC day
        for the last 30 days. Useful for weekly operational reviews.
        Requires `Authorization: Bearer <REPORTS_TOKEN>` header.
        Returns 501 when `REPORTS_TOKEN` or D1 DB is not configured.
      operationId: getReportsDigest
      security:
        - BearerToken: []
      responses:
        "200":
          description: JSON digest of report counts
          content:
            application/json:
              schema:
                type: object
                required: [ok, generatedAt, summary]
                properties:
                  ok:
                    type: boolean
                    example: true
                  generatedAt:
                    type: string
                    format: date-time
                  summary:
                    type: array
                    items:
                      type: object
                      required: [type, day, count]
                      properties:
                        type:
                          type: string
                          example: "csp-violation"
                        day:
                          type: string
                          format: date
                          example: "2026-04-23"
                        count:
                          type: integer
                          example: 5
        "401":
          description: Missing or invalid REPORTS_TOKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: REPORTS_TOKEN or D1 DB not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitError"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "Missing required parameter: lat"
        param:
          type: string
          example: lat
    WorkerEnvelope:
      type: object
      description: |
        Standard wrapper returned by routes that support KV stale fallback.
        When `stale` is `true`, data was served from Cloudflare KV because
        the upstream API was unreachable (see ADR-013).
      required: [data, provider, stale, timestamp]
      properties:
        data:
          description: The actual payload (route-specific shape)
        provider:
          type: string
          description: |
            Data source identifier. Suffixed with `-kv-stale` when served from KV.
          example: yahoo-kv-stale
        stale:
          type: boolean
          description: True when data was served from KV stale cache
          example: false
        timestamp:
          type: integer
          description: Unix timestamp (ms) when data was fetched
          example: 1720000000000
    NewsItem:
      type: object
      description: A single normalised news article from the aggregate feed
      required: [title, link, pubDate, source]
      properties:
        title:
          type: string
          description: Article headline (HTML entities decoded)
          example: "Cabinet approves 2025 budget"
        link:
          type: string
          format: uri
          example: "https://www.ynetnews.com/articles/0,7340,L-123456,00.html"
        pubDate:
          type: string
          format: date-time
          description: ISO 8601 publication time
          example: "2025-07-01T10:30:00.000Z"
        description:
          type: string
          description: Article summary / first paragraph (plain text)
          example: "The cabinet unanimously approved the state budget for 2025."
        source:
          type: string
          description: Human-readable publisher name
          example: "Ynet News"
    BrowserReport:
      type: object
      description: |
        A single report as submitted by the browser Reporting API
        (https://www.w3.org/TR/reporting-1/).
      required: [type]
      properties:
        type:
          type: string
          example: "csp-violation"
          description: Report type — "csp-violation", "deprecation", "intervention", etc.
        url:
          type: string
          format: uri
          description: URL of the document that generated the report
          example: "https://rajwanyair.github.io/FamilyDashBoard/"
        body:
          type: object
          description: Report body (structure varies by type)
          properties:
            documentURL:
              type: string
              format: uri
            blockedURL:
              type: string
            effectiveDirective:
              type: string
              example: "script-src"
            statusCode:
              type: integer
            message:
              type: string
            id:
              type: string
            sourceFile:
              type: string

  responses:
    ValidationError:
      description: Missing or invalid query parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimitError:
      description: Rate limit exceeded (120 req/min per IP)
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests per minute
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in current window
        Retry-After:
          schema:
            type: integer
          description: Seconds until the window resets
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  headers:
    X-RateLimit-Limit:
      description: Maximum requests per minute per IP
      schema:
        type: integer
        example: 120
    X-RateLimit-Remaining:
      description: Remaining requests in the current window
      schema:
        type: integer
        example: 115
